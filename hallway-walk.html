<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Hallway — walk it</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Crect x='12' y='7' width='9' height='18' rx='1' fill='none' stroke='%23d8b878' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{--ink:#d8b878;--paper:#0a0908}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #screen{position:absolute;inset:0;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    color:var(--ink);background:var(--paper);line-height:0.92em;white-space:pre;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 2.6s ease;
    text-shadow:0 0 5px rgba(216,184,120,.16)}
  #screen.on{opacity:1}
  #panel{position:fixed;inset:10px;z-index:3;pointer-events:none;border:2px solid rgba(216,184,120,.28);border-radius:4px;
    box-shadow:inset 0 0 120px 34px rgba(0,0,0,.72)}
  #cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 108px);z-index:6;
    max-width:min(30em,86vw);background:#efe7d2;color:#20180c;border:1.5px solid #20180c;border-radius:3px;
    padding:13px 18px;font-family:"Newsreader",Georgia,serif;font-size:clamp(1.05rem,3.4vw,1.35rem);line-height:1.42;
    box-shadow:4px 4px 0 rgba(0,0,0,.55);opacity:0;transition:opacity .55s ease;text-align:center}
  #cap.on{opacity:1}
  #cap .said{font-style:italic;color:#7a5a1e}
  #act{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 40px);z-index:6;
    display:flex;gap:12px;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity .5s ease}
  #act.on{opacity:1}
  button.b{font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.05em;color:#efe7d2;background:rgba(20,16,10,.6);
    border:1px solid var(--ink);border-radius:999px;padding:13px 22px;cursor:pointer}
  button.b:active{transform:translateY(1px)}
  input#see{font-family:"Newsreader",serif;font-style:italic;font-size:1.15rem;background:transparent;color:var(--ink);
    border:0;border-bottom:1px solid var(--ink);text-align:center;width:min(20em,80vw);padding:8px 4px;outline:none}
</style>
</head>
<body>
<pre id="screen"></pre>
<div id="panel"></div>
<div id="cap"></div>
<div id="act"></div>

<script>
(function(){
"use strict";
document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
var _lt=0;document.addEventListener("touchend",function(e){var n=Date.now();if(n-_lt<=350)e.preventDefault();_lt=n;},{passive:false});
var screen=document.getElementById("screen"), cap=document.getElementById("cap"), act=document.getElementById("act");

/* ---- sound ---- */
var AC=null;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t,v){var a=audio();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=t||"sine";o.frequency.value=f;
  o.connect(g);g.connect(a.destination);var s=a.currentTime;g.gain.setValueAtTime(v||0.15,s);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d+0.02);}
function knock(v){tone(88,0.16,"sine",v||0.26);setTimeout(function(){tone(66,0.18,"sine",(v||0.26)*0.8);},70);}
function creak(){tone(150,0.5,"sawtooth",0.05);setTimeout(function(){tone(120,0.4,"sawtooth",0.04);},120);}
function clik(){tone(1500,0.04,"square",0.08);}

/* ---- corridor ---- */
var MAP=["#####","#...#","#...#","#...#","D...#","#...#","#...#","#...D","#...#","#...#","#...#","#...T","#...#","#...#","#...#","#...#","#...#","#...#","#...#","#####"];
var MH=MAP.length,MW=MAP[0].length,TARGET={x:4,y:11},doorOpen=0,opening=false;
function Cc(x,y){if(x<0||y<0||x>=MW||y>=MH)return "#";return MAP[y|0][x|0];}
function solid(x,y){var c=Cc(x,y);return c==="#"||c==="D"||c==="T";}
function isDoor(x,y){var c=Cc(x,y);return c==="D"||c==="T";}

var W,H,FS;
function sizeGrid(){var vw=innerWidth,vh=innerHeight;FS=Math.max(7,Math.min(13,Math.round(Math.min(vw,vh)/46)));screen.style.fontSize=FS+"px";
  W=Math.max(44,Math.min(150,Math.floor(vw/(FS*0.60))));H=Math.max(30,Math.min(88,Math.floor(vh/(FS*0.92))));}
sizeGrid();addEventListener("resize",sizeGrid);addEventListener("orientationchange",function(){setTimeout(sizeGrid,200);});

/* ---- camera on rails ---- */
var cam={x:2.5,y:1.5,ang:Math.PI/2},FOV=0.66,bob=0,now=0;
var SHADE="@N#WkHm=+~:-. ";
var LIGHT="@8&%$#*o";  // bright spill from the opened door
function cast(sx){
  var dx=Math.cos(cam.ang),dy=Math.sin(cam.ang),pX=-dy*FOV,pY=dx*FOV;
  var camX=2*sx/W-1,rdx=dx+pX*camX,rdy=dy+pY*camX;
  var mx=cam.x|0,my=cam.y|0,ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy),stepX,stepY,dX,dY;
  if(rdx<0){stepX=-1;dX=(cam.x-mx)*ddx;}else{stepX=1;dX=(mx+1-cam.x)*ddx;}
  if(rdy<0){stepY=-1;dY=(cam.y-my)*ddy;}else{stepY=1;dY=(my+1-cam.y)*ddy;}
  var side=0,hit=false,g=0;
  while(!hit&&g++<300){if(dX<dY){dX+=ddx;mx+=stepX;side=0;}else{dY+=ddy;my+=stepY;side=1;}if(solid(mx,my))hit=true;}
  var d=(side===0)?(dX-ddx):(dY-ddy);if(d<0.0001)d=0.0001;
  return {d:d,side:side,door:isDoor(mx,my),target:(mx===TARGET.x&&my===TARGET.y)};
}
function rnd(x,y,t){var m=Math.sin(x*12.9898+y*78.233+t)*43758.5453;return m-Math.floor(m);}
function render(){
  var out="",col=[];
  for(var x=0;x<W;x++)col[x]=cast(x);
  var hb=Math.round(bob), tt=now*0.00016;
  for(var y=0;y<H;y++){var r="";
    for(var x=0;x<W;x++){var c=col[x],lh=Math.floor(H/c.d),s=(((H-lh)/2)|0)+hb,e=(((H+lh)/2)|0)+hb,ch;
      if(y<s||y>e){                                   // air — ceiling/floor + drifting dust
        var p=Math.abs((y-H/2)/(H/2));
        ch = p>0.80 ? " " : (((x+y*3)%9===0)?".":" ");
        if(ch===" " && rnd(x, y, ((tt*40)|0))>0.9955) ch="·";     // dust motes
      } else {
        var si=Math.floor(c.d/16*(SHADE.length-1));if(c.side===1)si++;if(si<0)si=0;if(si>=SHADE.length)si=SHADE.length-1;ch=SHADE[si];
        if(c.door){
          var t=(y-s)/Math.max(1,e-s);
          ch=((y-s)%3===0)?(c.side===0?"|":"]"):ch;
          if(t>0.46&&t<0.54)ch="o";                    // knob
          if(t>0.9)ch="_";                             // light line beneath
          if(c.target){
            if(t>0.9 && doorOpen<0.05) ch="=";         // that thin glow, even before it opens
            if(doorOpen>0){
              var op=t>(0.5-0.5*doorOpen)&&t<(0.5+0.5*doorOpen);
              if(op){ var li=(rnd(x,y,(tt*30)|0)* LIGHT.length)|0; ch=LIGHT[Math.min(LIGHT.length-1,li)]; }
            }
          }
        }
      }
      r+=ch;}
    out+=r+"\n";}
  screen.textContent=out;
}

/* ---- glide tween ---- */
var WP=[{x:2.5,y:1.5,ang:Math.PI/2},{x:2.5,y:5.5,ang:Math.PI/2},{x:2.5,y:9.2,ang:Math.PI/2},{x:2.5,y:11.5,ang:0}];
var wpIdx=0,tween=null,lastY=1.5;
function easeInOut(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function lerpAng(a,b,t){var d=((b-a+Math.PI)%(2*Math.PI))-Math.PI;return a+d*t;}
function glideTo(i,dur,done){var from={x:cam.x,y:cam.y,ang:cam.ang},to=WP[i],t0=null;
  tween={fn:function(ts){if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/dur),e=easeInOut(k);
    cam.x=from.x+(to.x-from.x)*e;cam.y=from.y+(to.y-from.y)*e;cam.ang=lerpAng(from.ang,to.ang,e);
    if(Math.floor(cam.y)!==Math.floor(lastY)){ if(isDoor(0,cam.y|0)||isDoor(MW-1,cam.y|0)) creak(); lastY=cam.y; }
    if(k>=1){tween=null;if(done)done();}}};
}
function loop(ts){ now=ts;
  if(tween)tween.fn(ts); else bob=Math.sin(ts*0.0016)*0.35;
  if(opening&&doorOpen<1) doorOpen=Math.min(1,doorOpen+0.006);
  render(); requestAnimationFrame(loop);
}

/* ---- narration ---- */
var state="intro";
function showCap(h){cap.classList.remove("on");setTimeout(function(){cap.innerHTML=h;cap.classList.add("on");},140);}
function acts(list){act.classList.remove("on");act.innerHTML="";
  list.forEach(function(a){if(a.input){act.appendChild(a.el);return;}var b=document.createElement("button");b.className="b";b.textContent=a.t;b.onclick=function(){audio();a.f();};act.appendChild(b);});
  setTimeout(function(){act.classList.add("on");},220);}
function esc(s){return s.replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function intro(){showCap("Let the room go quiet. Breathe out once, all the way.");acts([{t:"I have",f:voidBeat}]);}
function voidBeat(){showCap("A black void. No walls, no floor, no light. You look down: no body, no memory. Nothing here.");acts([{t:"Wait",f:materialize}]);}
function materialize(){
  cap.classList.remove("on");act.classList.remove("on");
  showCap("<span class='said'>And then — something. A hallway.</span>");screen.classList.add("on");
  setTimeout(function(){state="walk";
    showCap("You have a body now. The hall runs ahead. Far down it, on the left, a door is knocking. Move toward it.");knock();
    acts([{t:"↓ move forward",f:step}]);
    var kt=setInterval(function(){if(state!=="walk"){clearInterval(kt);return;}knock(0.2);},2800);
  },2700);
}
var lines=["A door on your left drifts past, its light leaking under the frame. The knock is nearer.","Dust turns in the air. Another door, shut tight. Closer now — you feel it in your chest."];
function step(){
  if(tween)return; wpIdx++;
  act.classList.remove("on");cap.classList.remove("on");
  if(wpIdx>=WP.length-1){ approach(); return; }
  glideTo(wpIdx,1900,function(){knock(0.3);showCap(lines[wpIdx-1]);acts([{t:"↓ move forward",f:step}]);});
}
function approach(){
  state="approach";
  showCap("As you near it, the knob turns on its own. <span class='said'>click… click… click…</span> and the door swings open ahead of you — light spilling out into the hall.");
  clik();setTimeout(clik,650);setTimeout(clik,1300);
  opening=true;                                        // the door animates open AHEAD, while you glide in
  glideTo(WP.length-1, 3200, function(){ threshold(); });
}
function threshold(){
  state="open";
  showCap("You reach the threshold, standing in the light. On the other side, you see —");
  var inp=document.createElement("input");inp.id="see";inp.type="text";inp.placeholder="what's behind the door?";inp.autocomplete="off";
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&inp.value.trim())receive(inp.value.trim());});
  acts([{input:true,el:inp},{t:"that's what I see",f:function(){if(inp.value.trim())receive(inp.value.trim());else inp.focus();}}]);
  setTimeout(function(){inp.focus();},500);
}
function receive(w){window._saw=w;state="reflect";
  showCap("You saw: <span class='said'>"+esc(w)+"</span>. Don't explain it yet. Let it be true for a second.");
  acts([{t:"okay",f:function(){showCap("It points at something you already carry. What in your waking life has the shape of <span class='said'>"+esc(window._saw)+"</span>? You don't have to tell me. You already know.");
    acts([{t:"walk it again",f:function(){location.reload();}},{t:"play for real",f:function(){location.href="https://sleepyplanet.studio";}}]);}}]);
}
addEventListener("keydown",function(e){var k=e.key.toLowerCase();if((k==="w"||k==="arrowup"||k===" ")&&state==="walk"&&!tween){e.preventDefault();step();}});

intro();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
