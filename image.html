<script>
(function(){"use strict";
document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
var _lt=0;document.addEventListener("touchend",function(e){var n=Date.now();if(n-_lt<=350)e.preventDefault();_lt=n;},{passive:false});
var screen=document.getElementById("screen"), img=document.getElementById("src");
var cv=document.createElement("canvas"), cx=cv.getContext("2d"), DATA=null, IW=0, IH=0;
var RAMP=" .:-=+*oO8%@#";  // dark -> bright
var W,H,FS;
function sizeGrid(){var vw=innerWidth,vh=innerHeight;FS=Math.max(7,Math.min(13,Math.round(Math.min(vw,vh)/46)));screen.style.fontSize=FS+"px";W=Math.max(44,Math.min(150,Math.floor(vw/(FS*0.60))));H=Math.max(30,Math.min(88,Math.floor(vh/(FS*0.92))));}
sizeGrid();addEventListener("resize",sizeGrid);addEventListener("orientationchange",function(){setTimeout(sizeGrid,200);});
function load(){IW=img.naturalWidth;IH=img.naturalHeight;cv.width=IW;cv.height=IH;cx.drawImage(img,0,0);DATA=cx.getImageData(0,0,IW,IH).data;}
if(img.complete&&img.naturalWidth) load(); else img.onload=load;
function bright(sx,sy){ if(sx<0)sx=0;if(sy<0)sy=0;if(sx>=IW)sx=IW-1;if(sy>=IH)sy=IH-1; var i=((sy|0)*IW+(sx|0))*4; return (DATA[i]+DATA[i+1]+DATA[i+2])/765; }
/* camera: zoom (walk in/out) + pan (look around). Faux-depth: forward shrinks the sampled window toward center = you move into it. */
var zoom=1, panX=0.5, panY=0.5;
function render(){
 if(!DATA){screen.textContent="loading…";return;}
 var rw=IW/zoom, rh=IH/zoom;
 var ox=panX*IW-rw/2, oy=panY*IH-rh/2;
 var out="";
 for(var gy=0;gy<H;gy++){ var r=""; var sy=oy+(gy/H)*rh;
   for(var gx=0;gx<W;gx++){ var sx=ox+(gx/W)*rw; var b=bright(sx,sy); r+=RAMP[Math.min(RAMP.length-1,(b*(RAMP.length-1))|0)]; }
   out+=r+"\n"; }
 screen.textContent=out;
}
var keys={};
addEventListener("keydown",function(e){var k=e.key.toLowerCase();keys[k]=true;if(k.indexOf("arrow")===0)e.preventDefault();});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
[].forEach.call(document.querySelectorAll(".btn"),function(b){var k=b.dataset.k;
 var on=function(e){e.preventDefault();keys[k]=true;b.classList.add("on");};var off=function(e){e.preventDefault();keys[k]=false;b.classList.remove("on");};
 b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off);});
function clamp(v,a,c){return v<a?a:v>c?c:v;}
function tick(){
 if(keys["w"]||keys["arrowup"]) zoom=clamp(zoom*1.02,1,14);
 if(keys["s"]||keys["arrowdown"]) zoom=clamp(zoom/1.02,1,14);
 if(keys["a"]||keys["arrowleft"]) panX=clamp(panX-0.006,0.08,0.92);
 if(keys["d"]||keys["arrowright"]) panX=clamp(panX+0.006,0.08,0.92);
 if(keys["q"]) panY=clamp(panY-0.006,0.08,0.92);
 if(keys["e"]) panY=clamp(panY+0.006,0.08,0.92);
 render(); requestAnimationFrame(tick);
}
tick();
})();

    border:1px solid rgba(233,226,212,.26);background:rgba(10,9,8,.55);color:rgba(233,226,212,.5);
    font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.16em;
    text-transform:lowercase;text-decoration:none;line-height:1;transition:color .3s ease,border-color .3s ease}
