<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ascii worlds — walkable</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080c'/%3E%3Ctext x='16' y='23' font-size='22' text-anchor='middle' fill='%2340e0d0' font-family='monospace'%3E%23%3C/text%3E%3C/svg%3E">
<style>
  :root{ --c:#3fe0cf; --bg:#05080c; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #screen{position:absolute;inset:0;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    color:var(--c);background:var(--bg);line-height:0.92em;letter-spacing:0;white-space:pre;
    display:flex;align-items:center;justify-content:center;}
  /* scene bar */
  #scenes{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);z-index:6;
    display:flex;gap:6px;font-family:ui-monospace,Menlo,monospace}
  #scenes .s{border:1px solid var(--c);border-radius:8px;background:rgba(127,127,127,.10);color:var(--c);
    font:inherit;font-size:11px;letter-spacing:.06em;padding:7px 10px;cursor:pointer;opacity:.5}
  #scenes .s.sel{opacity:1;background:rgba(127,127,127,.26)}
  /* touch controls */
  .pad{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:5;display:grid;gap:8px;opacity:.8}
  .pad.left{left:16px;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);grid-template-areas:". up ." "lft dn rgt"}
  .pad.right{right:16px;grid-template-columns:repeat(3,50px);grid-template-rows:50px;grid-template-areas:"tl tt tr"}
  .btn{width:50px;height:50px;border:1px solid var(--c);border-radius:12px;background:rgba(127,127,127,.09);
    color:var(--c);font-family:ui-monospace,monospace;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.6}
  .btn:active,.btn.on{background:rgba(127,127,127,.28);opacity:1}
  .up{grid-area:up}.dn{grid-area:dn}.lft{grid-area:lft}.rgt{grid-area:rgt}.tl{grid-area:tl}.tt{grid-area:tt}.tr{grid-area:tr}
  @media (min-width:900px){ .pad{opacity:.4} }
  /* visuals panel */
  #fx{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:6;font-family:ui-monospace,Menlo,monospace;color:var(--c)}
  #fxToggle{border:1px solid var(--c);border-radius:10px;background:rgba(127,127,127,.09);color:var(--c);font:inherit;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;cursor:pointer}
  #fxPanel{display:none;margin-top:8px;width:200px;padding:13px;border:1px solid var(--c);border-radius:12px;background:rgba(5,8,12,.92)}
  #fxPanel.open{display:block}
  .grp{margin:0 0 12px}.lab{font-size:9px;letter-spacing:.15em;text-transform:uppercase;opacity:.6;margin:0 0 6px}
  .opts{display:flex;flex-wrap:wrap;gap:5px}
  .opt{border:1px solid var(--c);border-radius:7px;background:transparent;color:var(--c);font:inherit;font-size:11px;padding:5px 8px;cursor:pointer;opacity:.55}
  .opt.sel{opacity:1;background:rgba(127,127,127,.22)}
  .sw{width:20px;height:20px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.sel{border-color:#fff}
  input[type=range]{width:100%;accent-color:var(--c)}
  .tog{display:flex;gap:6px}.tog .opt{flex:1;text-align:center}
</style>
</head>
<body>
<pre id="screen"></pre>
<div id="scenes"></div>
<div class="pad left"><div class="btn up" data-k="w">▲</div><div class="btn lft" data-k="q">‹</div><div class="btn dn" data-k="s">▼</div><div class="btn rgt" data-k="e">›</div></div>
<div class="pad right"><div class="btn tl" data-k="a">◀</div><div class="btn tt" data-k="w">▲</div><div class="btn tr" data-k="d">▶</div></div>
<div id="fx">
  <button id="fxToggle">◈ visuals</button>
  <div id="fxPanel">
    <div class="grp"><div class="lab">material</div><div class="opts" id="charsetOpts"></div></div>
    <div class="grp"><div class="lab">color</div><div class="opts" id="colorOpts"></div></div>
    <div class="grp"><div class="lab">glow <span id="glowV"></span></div><input type="range" id="glow" min="0" max="24" value="9"></div>
    <div class="grp"><div class="lab">fog / view <span id="viewV"></span></div><input type="range" id="view" min="8" max="44" value="22"></div>
    <div class="grp"><div class="lab">field of view <span id="fovV"></span></div><input type="range" id="fov" min="40" max="115" value="66"></div>
    <div class="grp"><div class="lab">shimmer</div><div class="tog"><button class="opt sel" data-sh="0">off</button><button class="opt" data-sh="1">low</button><button class="opt" data-sh="2">high</button></div></div>
    <div class="grp"><div class="lab">auto-drift</div><div class="tog"><button class="opt sel" data-dr="0">off</button><button class="opt" data-dr="1">on</button></div></div>
  </div>
</div>

<script>
(function(){
"use strict";
var screen=document.getElementById("screen");

/* ---------- map helpers ---------- */
function genMap(w,h,dens,seed){
  var rows=[];
  for(var y=0;y<h;y++){ var r=[];
    for(var x=0;x<w;x++){
      if(x===0||y===0||x===w-1||y===h-1) r.push("#");
      else { var hs=(((x*seed)^(y*2654435761)^(seed*40503))>>>0)%1000/1000; r.push(hs<dens?"#":"."); }
    } rows.push(r);
  } return rows;
}
function officeMap(w,h){
  var rows=[];
  for(var y=0;y<h;y++){ var r=[];
    for(var x=0;x<w;x++){
      if(x===0||y===0||x===w-1||y===h-1) r.push("#");
      else r.push(((x%4>=2)&&(y%4>=2))?"#":".");   // 2x2 cubicle pods, 2-wide aisles
    } rows.push(r);
  } return rows;
}
function carve(map,cx,cy){ for(var y=cy-1;y<=cy+1;y++) for(var x=cx-1;x<=cx+1;x++)
  if(map[y]&&map[y][x]!==undefined && !(x===0||y===0||x===map[0].length-1||y===map.length-1)) map[y][x]="."; }

var CITY=[
"########################","#......................#","#.####.####.####.####..#","#.####.####.####.####..#",
"#.####.####.####.####..#","#......................#","#.####.####.####.####..#","#.####.####.####.####..#",
"#.####.####.####.####..#","#......................#","#.####.####.####.####..#","#.####.####.####.####..#",
"#.####.####.####.####..#","#......................#","#.####.####.####.####..#","#.####.####.####.####..#",
"#.####.####.####.####..#","#......................#","#.####.####.####.####..#","#.####.####.####.####..#",
"#.####.####.####.####..#","#......................#","#......................#","########################"];

var forest=genMap(30,24,0.17,1315423911); carve(forest,15,12);
var beach =genMap(34,24,0.03,777); carve(beach,17,20);
var office=officeMap(30,22);
var realm =genMap(30,24,0.23,2246822519); carve(realm,15,12);

/* ---------- scenes ---------- */
function star(x,y){ var h=((x*73856093)^(y*19349663))>>>0; return (h%29)===0; }
function pick(str,i){ return str[Math.min(str.length-1,Math.max(0,i|0))]; }

var SCENES={
  city:{ label:"city", map:CITY, spawn:[2.5,1.5,1,0], wall:"@N#WH=+~:-,. ", color:"#3fe0cf", glow:9, view:22, fov:0.66, shimmer:0,
    sky:function(x,y,t){ return star(x,y)?".":" "; },
    floor:function(x,y,t){ return pick(" .,:;+",(((y-H/2)/(H/2))*6)); } },

  forest:{ label:"forest", map:forest, spawn:[15.5,12.5,1,0], wall:"@&%$#*+:-. ", color:"#66df66", glow:6, view:18, fov:0.66, shimmer:0,
    sky:function(x,y,t){ return ((x*7 + y*13 + ((t*0.4)|0))%17===0)?"`":" "; },
    floor:function(x,y,t){ return " .,;"[((x*5+y*3+((t*0.2)|0))>>>0)%4]; } },

  beach:{ label:"beach", map:beach, spawn:[17.5,20.5,0,-1], wall:"@#%x=+:. ", color:"#46d0ff", glow:11, view:30, fov:0.72, shimmer:0,
    sky:function(x,y,t){ var c=Math.sin(x*0.09 - t*0.012); return (y<3 && c>0.55)?"~":" "; },
    floor:function(x,y,t){
      var p=(y-H/2)/(H/2);
      if(p>0.86) return " .:."[(x+y)&3];                         // sand at your feet
      var v=Math.sin(x*0.22 + y*0.55 + t*0.11) + 0.7*Math.sin(x*0.06 - t*0.06);
      var ch=pick("  .-~=≈",(v*0.5+0.5)*6);
      if(ch!==" " && Math.random()<0.007) ch="*";               // sun glints
      return ch; } },

  office:{ label:"office", map:office, spawn:[1.5,1.5,1,0], wall:"▓▓▒▒░░  ", color:"#d8e2e2", glow:0, view:34, fov:0.66, shimmer:0,
    sky:function(x,y,t){ return (y<2 && (x%12)<3)?"=":" "; },   // fluorescent panels
    floor:function(x,y,t){ return ((x*3+y*7)%13===0)?".":" "; } },

  realm:{ label:"realm", map:realm, spawn:[15.5,12.5,1,0], wall:"██▓▓▒▒░░  ", color:"#bf8cff", glow:17, view:24, fov:0.82, shimmer:2,
    sky:function(x,y,t){ var v=Math.sin(x*0.2 + t*0.05)+Math.cos(y*0.4 - t*0.04); return v>1.25?"*":(v>0.55?".":" "); },
    floor:function(x,y,t){ var v=Math.sin(x*0.3 + y*0.22 + t*0.06); return v>0.6?"░":(v>0?"·":" "); } }
};

/* ---------- state ---------- */
var MAP, MW, MH, SHADE, skyFn, floorFn;
var S={ view:22, glow:9, fov:0.66, shimmer:0, drift:false, color:"#3fe0cf" };
function wall(x,y){ if(x<0||y<0||x>=MW||y>=MH) return true; return MAP[y|0][x|0]==="#"; }

/* ---------- responsive grid ---------- */
var W,H,FS;
function sizeGrid(){ var vw=innerWidth,vh=innerHeight;
  FS=Math.max(7,Math.min(13,Math.round(Math.min(vw,vh)/46))); screen.style.fontSize=FS+"px";
  W=Math.max(44,Math.min(150,Math.floor(vw/(FS*0.60)))); H=Math.max(30,Math.min(88,Math.floor(vh/(FS*0.92)))); }
sizeGrid(); addEventListener("resize",sizeGrid);
addEventListener("orientationchange",function(){setTimeout(sizeGrid,200);});

/* ---------- player + raycaster ---------- */
var px=2.5,py=1.5,dx=1,dy=0,planeX=0,planeY=0.66;
function setFov(f){ S.fov=f; planeX=-dy*f; planeY=dx*f; }
var cStart=new Int16Array(0),cEnd=new Int16Array(0),cDist=new Float32Array(0),cSide=new Int8Array(0),cCh=[];
function cast(){
  if(cStart.length!==W){ cStart=new Int16Array(W);cEnd=new Int16Array(W);cDist=new Float32Array(W);cSide=new Int8Array(W);cCh=new Array(W); }
  for(var x=0;x<W;x++){
    var camX=2*x/W-1, rdx=dx+planeX*camX, rdy=dy+planeY*camX;
    var mx=px|0,my=py|0,ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy),stepX,stepY,sdx,sdy;
    if(rdx<0){stepX=-1;sdx=(px-mx)*ddx;}else{stepX=1;sdx=(mx+1-px)*ddx;}
    if(rdy<0){stepY=-1;sdy=(py-my)*ddy;}else{stepY=1;sdy=(my+1-py)*ddy;}
    var side=0,hit=false,g=0;
    while(!hit&&g++<500){ if(sdx<sdy){sdx+=ddx;mx+=stepX;side=0;}else{sdy+=ddy;my+=stepY;side=1;} if(wall(mx,my))hit=true; }
    var d=(side===0)?(sdx-ddx):(sdy-ddy); if(d<0.0001)d=0.0001;
    var lh=Math.floor(H/d); cStart[x]=((H-lh)/2)|0; cEnd[x]=((H+lh)/2)|0; cDist[x]=d; cSide[x]=side;
    var si=Math.floor(d/S.view*(SHADE.length-1)); if(side===1)si++; if(si<0)si=0; if(si>=SHADE.length)si=SHADE.length-1;
    cCh[x]=SHADE[si];
  }
}
function glyph(x,y,t){
  var s=cStart[x],e=cEnd[x],ch;
  if(y<s) ch=skyFn(x,y,t);
  else if(y<=e){ ch=cCh[x]; if(ch!==" "&&((y-s)%4===1)&&cDist[x]<S.view*0.6) ch=(cSide[x]===0?"=":"-"); }
  else ch=floorFn(x,y,t);
  if(S.shimmer && ch!==" " && y<=e && y>=s && Math.random()<(S.shimmer===2?0.05:0.018)) ch=SHADE[(Math.random()*(SHADE.length-1))|0];
  return ch;
}
function render(t){ var out=""; for(var y=0;y<H;y++){ var r=""; for(var x=0;x<W;x++) r+=glyph(x,y,t); out+=r+"\n"; } screen.textContent=out; }

/* ---------- input ---------- */
var keys={};
addEventListener("keydown",function(e){var k=e.key.toLowerCase();keys[k]=true;if(k.indexOf("arrow")===0)e.preventDefault();});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
[].forEach.call(document.querySelectorAll(".btn"),function(b){var k=b.dataset.k;
  var on=function(e){e.preventDefault();keys[k]=true;b.classList.add("on");};
  var off=function(e){e.preventDefault();keys[k]=false;b.classList.remove("on");};
  b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off);});
function move(fx,fy){var nx=px+fx,ny=py+fy;if(!wall(nx+Math.sign(fx)*0.15,py))px=nx;if(!wall(px,ny+Math.sign(fy)*0.15))py=ny;}
function rotate(a){var c=Math.cos(a),s=Math.sin(a);var ndx=dx*c-dy*s,ndy=dx*s+dy*c;dx=ndx;dy=ndy;var npx=planeX*c-planeY*s,npy=planeX*s+planeY*c;planeX=npx;planeY=npy;}
var MOVE=0.09,TURN=0.05,t=0;
function tick(){ t++;
  if(keys["w"]||keys["arrowup"])move(dx*MOVE,dy*MOVE); if(keys["s"]||keys["arrowdown"])move(-dx*MOVE,-dy*MOVE);
  if(keys["a"]||keys["arrowleft"])rotate(-TURN); if(keys["d"]||keys["arrowright"])rotate(TURN);
  if(keys["q"])move(dy*MOVE,-dx*MOVE); if(keys["e"])move(-dy*MOVE,dx*MOVE);
  if(S.drift){ move(dx*MOVE*0.55,dy*MOVE*0.55); rotate(Math.sin(t*0.012)*0.012); }
  cast(); render(t); requestAnimationFrame(tick);
}

/* ---------- panel ---------- */
function applyColor(hex){ document.documentElement.style.setProperty("--c",hex); S.color=hex; screen.style.textShadow="0 0 "+S.glow+"px "+hex; syncSwatch(); }
function applyGlow(){ screen.style.textShadow="0 0 "+S.glow+"px "+S.color; var g=document.getElementById("glowV"); if(g)g.textContent=S.glow; }
var RAMPS={ scene:null, ascii:"@N#WH=+~:-,. ", blocks:"██▓▓▒▒░░  ", binary:"11011001010. ", symbols:"@$%&#*+=;:~-. ", minimal:"@%#*+=-:. " };
var csOpts=document.getElementById("charsetOpts");
["scene","ascii","blocks","binary","symbols","minimal"].forEach(function(name){
  var b=document.createElement("button"); b.className="opt"+(name==="scene"?" sel":""); b.textContent=name; b.dataset.cs=name;
  b.onclick=function(){ SHADE=(name==="scene")?SCENES[cur].wall:RAMPS[name]; sel(csOpts,b); }; csOpts.appendChild(b);
});
var COLORS=[["#3fe0cf"],["#4dff72"],["#ffb347"],["#b98cff"],["#e8f0f0"],["#ff5d73"]];
var colOpts=document.getElementById("colorOpts");
COLORS.forEach(function(c){ var b=document.createElement("button"); b.className="sw"; b.style.background=c[0]; b.dataset.col=c[0];
  b.onclick=function(){ applyColor(c[0]); }; colOpts.appendChild(b); });
function syncSwatch(){ [].forEach.call(colOpts.children,function(x){x.classList.toggle("sel",x.dataset.col===S.color);}); }
function sel(container,b){ [].forEach.call(container.children,function(x){x.classList.toggle("sel",x===b);}); }
var glowEl=document.getElementById("glow"); glowEl.oninput=function(){ S.glow=+glowEl.value; applyGlow(); };
var viewEl=document.getElementById("view"); viewEl.oninput=function(){ S.view=+viewEl.value; document.getElementById("viewV").textContent=S.view; };
var fovEl=document.getElementById("fov"); fovEl.oninput=function(){ setFov((+fovEl.value)/100); document.getElementById("fovV").textContent=(+fovEl.value)+"°"; };
[].forEach.call(document.querySelectorAll("[data-sh]"),function(b){ b.onclick=function(){ S.shimmer=+b.dataset.sh; [].forEach.call(document.querySelectorAll("[data-sh]"),function(x){x.classList.toggle("sel",x===b);}); }; });
[].forEach.call(document.querySelectorAll("[data-dr]"),function(b){ b.onclick=function(){ S.drift=b.dataset.dr==="1"; [].forEach.call(document.querySelectorAll("[data-dr]"),function(x){x.classList.toggle("sel",x===b);}); }; });
document.getElementById("fxToggle").onclick=function(){ document.getElementById("fxPanel").classList.toggle("open"); };

/* ---------- scenes bar ---------- */
var cur="city";
var bar=document.getElementById("scenes");
function applyScene(key){
  cur=key; var sc=SCENES[key];
  MAP=sc.map; MW=MAP[0].length; MH=MAP.length; SHADE=sc.wall; skyFn=sc.sky; floorFn=sc.floor;
  px=sc.spawn[0]; py=sc.spawn[1]; dx=sc.spawn[2]; dy=sc.spawn[3]; setFov(sc.fov);
  S.view=sc.view; S.glow=sc.glow; S.shimmer=sc.shimmer;
  applyColor(sc.color); applyGlow();
  // reflect in panel
  viewEl.value=sc.view; document.getElementById("viewV").textContent=sc.view;
  glowEl.value=sc.glow; document.getElementById("glowV").textContent=sc.glow;
  fovEl.value=Math.round(sc.fov*100); document.getElementById("fovV").textContent=Math.round(sc.fov*100)+"°";
  [].forEach.call(document.querySelectorAll("[data-sh]"),function(x){x.classList.toggle("sel",+x.dataset.sh===sc.shimmer);});
  [].forEach.call(csOpts.children,function(x){x.classList.toggle("sel",x.dataset.cs==="scene");});
  [].forEach.call(bar.children,function(x){x.classList.toggle("sel",x.dataset.k===key);});
}
Object.keys(SCENES).forEach(function(k){ var b=document.createElement("button"); b.className="s"; b.textContent=SCENES[k].label; b.dataset.k=k;
  b.onclick=function(){ applyScene(k); }; bar.appendChild(b); });

applyScene("city");
tick();
})();
</script>
</body>
</html>
