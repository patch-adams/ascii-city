<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>a corridor</title>
<meta name="description" content="A corridor. The doors don't tell you what's behind them.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070607'/%3E%3Crect x='13' y='5' width='6' height='22' fill='%23e6c98a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{--ink:#e6c98a;--paper:#070607}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #screen{position:absolute;inset:0;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);
    background:var(--paper);line-height:0.92em;white-space:pre;display:flex;align-items:center;justify-content:center;
    text-shadow:0 0 6px rgba(230,201,138,.18);opacity:.10;transition:opacity 2.4s ease}
  #screen.lit{opacity:1}
  #panel{position:fixed;inset:10px;z-index:3;pointer-events:none;border:2px solid rgba(230,201,138,.20);border-radius:4px;
    box-shadow:inset 0 0 140px 44px rgba(0,0,0,.76)}
  #fade{position:fixed;inset:0;z-index:20;background:#050405;opacity:0;pointer-events:none;transition:opacity .5s ease}

  /* the arrival — one line, near dark */
  #gate{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:30px;padding:32px;transition:opacity 1.1s ease}
  #gate.gone{opacity:0;pointer-events:none}
  #gate .line{font-family:"Newsreader",Georgia,serif;font-style:italic;color:#efe7d2;text-align:center;
    font-size:clamp(1.15rem,4vw,1.7rem);line-height:1.5;max-width:19em;opacity:.92}
  #gate .in{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:#efe7d2;background:rgba(20,16,10,.5);border:1px solid var(--ink);border-radius:999px;padding:14px 30px;cursor:pointer;opacity:.8}
  #sig{position:fixed;left:26px;bottom:calc(env(safe-area-inset-bottom) + 24px);z-index:13;font-family:"Space Mono",monospace;
    font-size:10px;letter-spacing:.3em;text-transform:lowercase;color:rgba(230,201,138,.3);transition:opacity .9s ease}
  #sig.gone{opacity:0}

  /* the door readout — only ever appears when you're alongside one */
  #read{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 142px);z-index:8;
    display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;pointer-events:none;text-align:center;max-width:88vw}
  #read .num{font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.42em;color:rgba(230,201,138,.62);text-indent:.42em}
  #read .mark{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:clamp(1.25rem,4.6vw,1.7rem);color:#efe7d2;line-height:1.1}
  #read .open{margin-top:6px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:#efe7d2;background:rgba(20,16,10,.55);border:1px solid var(--ink);border-radius:999px;padding:12px 24px;cursor:pointer}
  #read .open:active{background:rgba(230,201,138,.26)}
  #read.shut .open{display:none}
  #read.shut .mark{color:rgba(233,226,212,.42)}

  /* touch controls — same pattern as city.html / hallway-walk.html */
  .pad{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:5;display:grid;gap:8px;opacity:.55}
  .pad.left{left:16px;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);grid-template-areas:". up ." "lft dn rgt"}
  .pad.right{right:16px;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);grid-template-areas:". tt ." "tl . tr"}
  .btn{width:50px;height:50px;border:1px solid rgba(230,201,138,.55);border-radius:12px;background:rgba(127,127,127,.07);
    color:var(--ink);font-family:ui-monospace,monospace;font-size:18px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:.62}
  .btn:active,.btn.on{background:rgba(230,201,138,.24);opacity:1}
  .up{grid-area:up}.dn{grid-area:dn}.lft{grid-area:lft}.rgt{grid-area:rgt}.tl{grid-area:tl}.tt{grid-area:tt}.tr{grid-area:tr}
  .pad.hid{opacity:0;pointer-events:none}
  @media (min-width:900px){ .pad{opacity:.3} }
</style>
</head>
<body>
<pre id="screen"></pre>
<div id="panel"></div>

<div id="read"><div class="num" id="rNum"></div><div class="mark" id="rMark"></div><button class="open" id="rOpen">open →</button></div>

<div class="pad left hid"><div class="btn up" data-k="w">▲</div><div class="btn lft" data-k="q">‹</div><div class="btn dn" data-k="s">▼</div><div class="btn rgt" data-k="e">›</div></div>
<div class="pad right hid"><div class="btn tt" data-k="w">▲</div><div class="btn tl" data-k="a">◀</div><div class="btn tr" data-k="d">▶</div></div>

<div id="gate"><div class="line">Nothing here announces itself. Walk up to a door.</div><button class="in" id="enter">enter</button></div>
<div id="sig">patch</div>
<div id="fade"></div>

<script>
(function(){
"use strict";
document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});

var screen=document.getElementById("screen"), gate=document.getElementById("gate"), sig=document.getElementById("sig"),
    fade=document.getElementById("fade"), read=document.getElementById("read"),
    rNum=document.getElementById("rNum"), rMark=document.getElementById("rMark"), rOpen=document.getElementById("rOpen"),
    pads=document.querySelectorAll(".pad");

/* ---------- sound: only ever on your own action ---------- */
var AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,d,t,v){ var a=audio(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain(); o.type=t||"sine"; o.frequency.value=f;
  o.connect(g); g.connect(a.destination); var s=a.currentTime;
  g.gain.setValueAtTime(v||.1,s); g.gain.exponentialRampToValueAtTime(.0001,s+d); o.start(s); o.stop(s+d+.02); }
function tick(){ tone(150,.05,"sine",.035); }
function creak(){ tone(92,.34,"sine",.16); setTimeout(function(){ tone(64,.4,"sine",.12); },90); }

/* ---------- the doors ---------- */
/* A door carries a number and, at most, a one-word mark. Nothing about what's inside.
   Doors without a destination are unlit — an honest locked door beats a dead link. */
var DOORS=[
  {y:3,  s:"L", n:"01", mark:"city",      url:"city.html"},
  {y:5,  s:"R", n:"02", mark:"hallway",   url:"hallway-walk.html"},
  {y:7,  s:"L", n:"03", mark:"breath",    url:"hallway.html"},
  {y:9,  s:"R", n:"04", mark:"routes",    url:"century.html"},
  {y:11, s:"L", n:"05", mark:"press",     url:"registration.html"},
  {y:13, s:"R", n:"06", mark:"image",     url:"image.html"},
  {y:15, s:"L", n:"07", mark:"depth",     url:"depth.html"},
  {y:17, s:"R", n:"08", mark:"gallery",   url:"tunnel.html"},
  {y:19, s:"L", n:"09", mark:"film",      url:"film.html"},
  {y:21, s:"R", n:"10", mark:"screening", url:"theater.html"},
  {y:23, s:"L", n:"11", mark:"presence",  url:"presence-demo.html"},
  {y:25, s:"R", n:"12", mark:"creature",  url:"creature.html"},
  {y:27, s:"L", n:"13", mark:"study",     url:"study.html"},
  {y:29, s:"R", n:"14", mark:"portrait",  url:"mike.html"},
  {y:31, s:"L", dark:true},
  {y:33, s:"R", n:"15", mark:"ma/ré",     url:"https://sleepyplanet.studio/mare", out:true}
];
var MW=7, MH=38;
/* the door at the far end. You can't see into it; it draws a card each visit. */
var END={y:MH-1, s:"E", mark:"unmarked", end:true};

var MAP=[];
(function build(){
  for(var y=0;y<MH;y++) MAP.push((y===0||y===MH-1) ? "#######".split("") : "#.....#".split(""));
  DOORS.forEach(function(d){ MAP[d.y][d.s==="L"?0:MW-1] = d.dark ? "K" : "D"; });
  MAP[MH-1][3]="X";
})();
function cellAt(x,y){ if(x<0||y<0||x>=MW||y>=MH) return "#"; return MAP[y|0][x|0]; }
function solid(x,y){ var c=cellAt(x,y); return c!=="."; }

/* ---------- door faces: a 5x7 stencil number, painted on the panel ---------- */
var TW=18, TH=20;
var FONT={
 "0":["01110","10001","10011","10101","11001","10001","01110"],
 "1":["00100","01100","00100","00100","00100","00100","01110"],
 "2":["01110","10001","00001","00010","00100","01000","11111"],
 "3":["11111","00010","00100","00010","00001","10001","01110"],
 "4":["00010","00110","01010","10010","11111","00010","00010"],
 "5":["11111","10000","11110","00001","00001","10001","01110"],
 "6":["00110","01000","10000","11110","10001","10001","01110"],
 "7":["11111","00001","00010","00100","01000","01000","01000"],
 "8":["01110","10001","10001","01110","10001","10001","01110"],
 "9":["01110","10001","10001","01111","00001","00010","01100"]
};
/* cl: 1 = door structure (resolves at middling range), 2 = the number (only up close) */
function buildTex(num){
  var ch=[], cl=[], x, y;
  for(y=0;y<TH;y++){ ch.push(new Array(TW).fill(" ")); cl.push(new Array(TW).fill(0)); }
  function put(px,py,c,k){ if(px>=0&&px<TW&&py>=0&&py<TH){ ch[py][px]=c; cl[py][px]=k; } }
  for(y=1;y<TH;y++){ put(1,y,"|",1); put(TW-2,y,"|",1); }        // jambs
  for(x=1;x<TW-1;x++) put(x,0,"_",1);                             // lintel
  for(x=3;x<TW-3;x++){ put(x,2,"-",1); put(x,TH-3,"-",1); }       // panel seams
  put(TW-4,(TH*0.62)|0,"o",1);                                    // handle
  if(num){
    var a=FONT[num.charAt(0)], b=FONT[num.charAt(1)], ox=((TW-11)/2)|0, oy=5;
    for(var r=0;r<7;r++) for(var c=0;c<5;c++){
      if(a[r].charAt(c)==="1") put(ox+c,   oy+r, "#", 2);
      if(b[r].charAt(c)==="1") put(ox+6+c, oy+r, "#", 2);
    }
  }
  return {ch:ch, cl:cl};
}
var TEX={};
DOORS.forEach(function(d){ TEX[d.y] = buildTex(d.n||null); });
var TEX_END = buildTex(null);
function texFor(my){ return (my===MH-1) ? TEX_END : (TEX[my]||TEX_END); }
function doorAtRow(my){ for(var i=0;i<DOORS.length;i++) if(DOORS[i].y===my) return DOORS[i]; return null; }

/* ---------- grid: full bleed, edge to edge, at any size ---------- */
var CW=0.60, CH=0.92, PLANE=0.90, WALLH=2.50;
var W,H,FS,PROJ;
function sizeGrid(){
  var vw=innerWidth, vh=innerHeight;
  var target = vw<520 ? 76 : (vw<900 ? 112 : 156);       // legible columns, not a fixed cap
  FS = Math.max(7, Math.min(26, vw/(target*CW)));
  /* overscan a little: real font metrics never match CW/CH exactly, and a short
     grid would leave a dead strip at the edge. Full bleed is the standing order. */
  W = Math.min(300, Math.max(40, Math.ceil(vw/(FS*CW)*1.03)));
  H = Math.min(132, Math.max(28, Math.ceil(vh/(FS*CH)*1.06)));
  /* characters are taller than they are wide — without this the corridor
     projects as a thin slot instead of something you're standing inside */
  PROJ = WALLH*W*CW/(2*PLANE*CH);
  screen.style.fontSize = FS.toFixed(2)+"px";
}
sizeGrid();
addEventListener("resize",sizeGrid);
addEventListener("orientationchange",function(){ setTimeout(sizeGrid,200); });

/* ---------- camera + raycaster ---------- */
var cam={x:3.5,y:1.6}, dirX=0, dirY=1, planeX=-PLANE, planeY=0;
function setDir(a){ dirX=Math.cos(a); dirY=Math.sin(a); planeX=-dirY*PLANE; planeY=dirX*PLANE; }
function heading(){ return Math.atan2(dirY,dirX); }
setDir(Math.PI/2);

/* A sparse ramp on purpose: density is the only brightness control an ASCII
   scene has, and this corridor is meant to sit in near-dark. */
var SHADE="#=+~:-.,·`  ", LIGHT="@&%#*+=~", VIEW=28;
var cS,cE,cD,cSide,cCell,cU,cRow,cRdx,cRdy,rowD,fxR,fyR;
function alloc(){ cS=new Int16Array(W);cE=new Int16Array(W);cD=new Float32Array(W);
  cSide=new Int8Array(W);cCell=new Array(W);cU=new Float32Array(W);cRow=new Int16Array(W);
  cRdx=new Float32Array(W);cRdy=new Float32Array(W); }
function cast(){
  if(!cS||cS.length!==W) alloc();
  for(var x=0;x<W;x++){
    var camX=2*x/W-1, rdx=dirX+planeX*camX, rdy=dirY+planeY*camX;
    var mx=cam.x|0, my=cam.y|0, ddx=Math.abs(1/rdx), ddy=Math.abs(1/rdy), stX,stY,sdx,sdy;
    if(rdx<0){stX=-1;sdx=(cam.x-mx)*ddx;}else{stX=1;sdx=(mx+1-cam.x)*ddx;}
    if(rdy<0){stY=-1;sdy=(cam.y-my)*ddy;}else{stY=1;sdy=(my+1-cam.y)*ddy;}
    var side=0,hit=false,g=0;
    while(!hit&&g++<400){ if(sdx<sdy){sdx+=ddx;mx+=stX;side=0;}else{sdy+=ddy;my+=stY;side=1;} if(solid(mx,my))hit=true; }
    var d=(side===0)?(sdx-ddx):(sdy-ddy); if(d<0.0001)d=0.0001;
    var u=(side===0)?(cam.y+d*rdy):(cam.x+d*rdx); u-=Math.floor(u);
    if(side===0&&rdx<0) u=1-u;                 // keep painted numbers reading the same on both walls
    if(side===1&&rdy>0) u=1-u;
    var lh=Math.floor(PROJ/d);
    cS[x]=((H-lh)/2)|0; cE[x]=((H+lh)/2)|0; cD[x]=d; cSide[x]=side; cCell[x]=cellAt(mx,my); cU[x]=u; cRow[x]=my;
    cRdx[x]=rdx; cRdy[x]=rdy;   /* kept for floor/ceiling casting — rayDir projects to 1 along dir,
                                   so travelling t along it lands at perpendicular distance t */
  }
}
function noise(x,y,t){ var m=Math.sin(x*12.9898+y*78.233+t)*43758.5453; return m-Math.floor(m); }

var MID=MW/2, LMAX=SHADE.length-1;
function shadeAt(d,bias){ var i=Math.floor(d/VIEW*LMAX)+bias; return SHADE[i<0?0:(i>LMAX?LMAX:i)]; }
/* stable per-surface-point hash — dithering keyed to the world, not the screen,
   so the grain sits still on the wall instead of crawling as you walk */
function hash3(a,b,c){
  var n=(Math.imul(a,374761393)+Math.imul(b,668265263)+Math.imul(c,1442695040))>>>0;
  n=Math.imul(n^(n>>>13),1274126177)>>>0;
  return ((n^(n>>>16))>>>0)/4294967296;
}
function render(now){
  var t=now*0.001, out="", tf=(t*7)|0, half=H/2;
  if(!rowD||rowD.length!==H) rowD=new Float32Array(H);
  for(var yy=0;yy<H;yy++){ var k=Math.abs(yy-half); rowD[yy] = k<0.5 ? 1e9 : PROJ/(2*k); }
  if(!fxR||fxR.length!==W){ fxR=new Float32Array(W); fyR=new Float32Array(W); }
  for(var y=0;y<H;y++){
    var r="", below=y>half, dRow=rowD[y], dNext=rowD[below?(y+1<H?y+1:y):(y>0?y-1:y)];
    var live=dRow<VIEW;
    if(live) for(var xx=0;xx<W;xx++){ fxR[xx]=cam.x+cRdx[xx]*dRow; fyR[xx]=cam.y+cRdy[xx]*dRow; }
    for(var x=0;x<W;x++){
      var s=cS[x], e=cE[x], ch=" ";
      if(y>e || y<s){
        /* Floor and ceiling, cast in real perspective, as a grid that converges on the
           vanishing point. A portrait phone looking down a corridor sees mostly these
           two surfaces, so they have to carry the space — seams are found by testing
           where a row or column crosses a whole world unit, which keeps every line
           exactly one cell thick instead of smearing into bands near the horizon. */
        if(live){
          var seam=false;
          if(dNext!==dRow && Math.floor(fyR[x])!==Math.floor(cam.y+cRdy[x]*dNext)) seam=true;
          if(!seam && x>0 && Math.floor(fxR[x])!==Math.floor(fxR[x-1])) seam=true;
          if(seam) ch=shadeAt(dRow, y>e?2:4);
          if(y<s){
            /* a run of dim panels overhead, every four units. They are the only light
               source in here, and they explain the pools of it on the floor. */
            var cy=fyR[x];
            if(Math.abs(fxR[x]-MID)<0.55 && (cy-Math.floor(cy/4)*4)<0.7)
              ch=LIGHT[Math.min(LIGHT.length-1, 4+((dRow/VIEW)*4|0))];
          }
        }
      } else {
        var d=cD[x], cell=cCell[x], v=(y-s)/Math.max(1,e-s), bias=cSide[x]===1?1:0;
        var tx=(cU[x]*TW)|0, ty=(v*TH)|0;
        if(tx<0)tx=0; if(tx>=TW)tx=TW-1; if(ty<0)ty=0; if(ty>=TH)ty=TH-1;
        if(cell==="#"){
          /* joints every world unit. Vertical, so they converge with the corridor
             instead of banding across it the way horizontal courses do. */
          ch = (tx<1||tx>TW-2) ? shadeAt(d,bias) : shadeAt(d,bias+1);
        } else {
          var tex=texFor(cRow[x]), k=tex.cl[ty][tx];
          ch=shadeAt(d,bias+3);                                       // panel, recessed from the wall
          if(k===1 && d<15) ch=tex.ch[ty][tx];                        // jambs, lintel, seams, handle
          else if(k===2 && d<7.5) ch=tex.ch[ty][tx];                  // the number — only up close
          if(cell==="D" && v>0.945) ch=LIGHT[Math.min(LIGHT.length-1, 1+((d/VIEW)*9|0))];
          if(cell==="X" && hash3(tx,ty,(t*1.4)|0)>0.986) ch="·";      // the unmarked one, faintly astir
        }
      }
      if(ch===" " && noise(x,y,tf)>0.9977) ch="·";                    // dust
      r+=ch;
    }
    out+=r+"\n";
  }
  screen.textContent=out;
}

/* ---------- which door you're alongside ---------- */
/* Doors alternate walls every two cells, so at most one is ever within reach. */
var REACH=1.35, active=null, activeKey="";
function findActive(){
  if(cam.y > MH-3.0) return END;
  var best=null, bd=1e9;
  for(var i=0;i<DOORS.length;i++){
    var dy=Math.abs(cam.y-(DOORS[i].y+0.5));
    if(dy<REACH && dy<bd){ bd=dy; best=DOORS[i]; }
  }
  return best;
}
function keyOf(d){ return d ? (d.end?"end":String(d.y)) : ""; }
function paintRead(d){
  read.classList.toggle("shut", !!(d&&d.dark));
  if(!d) return;
  if(d.end){ rNum.textContent="⁂"; rMark.textContent="unmarked"; rOpen.textContent="open →"; }
  else if(d.dark){ rNum.textContent="——"; rMark.textContent="unlit"; }
  else { rNum.textContent=d.n; rMark.textContent=d.mark; rOpen.textContent = d.out ? "open ↗" : "open →"; }
}

/* ---------- opening ---------- */
var opening=false;
function remember(){ try{ sessionStorage.setItem("corridor",
  JSON.stringify({x:cam.x,y:cam.y,a:heading()})); }catch(e){} }
function openDoor(){
  var d=active; if(!d||opening||d.dark) return;
  audio(); creak();
  /* the one door that leaves the building opens in its own tab — there is no way
     to hang a way-back on someone else's site, so the corridor stays behind you.
     A real link, not window.open: with noopener that returns null even on success. */
  if(d.out){
    remember();
    var a=document.createElement("a");
    a.href=d.url; a.target="_blank"; a.rel="noopener noreferrer";
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  var url=d.url;
  if(d.end){                                   /* Door 4 — draws a card */
    var pool=DOORS.filter(function(k){ return k.url && !k.out; });
    url = pool[(Math.random()*pool.length)|0].url;
  }
  opening=true; remember(); fade.style.opacity=1;
  setTimeout(function(){ location.href=url; },520);
}
rOpen.addEventListener("click",function(e){ e.preventDefault(); openDoor(); });

/* ---------- input ---------- */
var keys={}, walking=false;
addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(!walking){ if(k==="enter"||k===" "||k==="w"||k==="arrowup"){ e.preventDefault(); begin(); } return; }
  if(k==="enter"||k==="o"){ e.preventDefault(); openDoor(); return; }
  keys[k]=true; if(k.indexOf("arrow")===0||k===" ") e.preventDefault();
});
addEventListener("keyup",function(e){ keys[e.key.toLowerCase()]=false; });
[].forEach.call(document.querySelectorAll(".btn"),function(b){
  var k=b.dataset.k;
  var on=function(e){ e.preventDefault(); audio(); keys[k]=true; b.classList.add("on"); };
  var off=function(e){ e.preventDefault(); keys[k]=false; b.classList.remove("on"); };
  b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off);
  b.addEventListener("pointerleave",off); b.addEventListener("pointercancel",off);
});

function step(fx,fy){
  var nx=cam.x+fx, ny=cam.y+fy;
  if(!solid(nx+Math.sign(fx)*0.22, cam.y)) cam.x=nx;
  if(!solid(cam.x, ny+Math.sign(fy)*0.22)) cam.y=ny;
}
function turn(a){ setDir(heading()+a); }
/* per 60th of a second, not per frame — otherwise a 120Hz screen walks the
   corridor at double speed */
var MOVE=0.105, TURN=0.045, lastTs=0;

/* ---------- the arrival ---------- */
function begin(){
  if(walking) return;
  walking=true; audio();
  gate.classList.add("gone"); sig.classList.add("gone"); screen.classList.add("lit");
  [].forEach.call(pads,function(p){ p.classList.remove("hid"); });
  setTimeout(function(){ gate.style.display="none"; },1200);
}
document.getElementById("enter").addEventListener("click",function(e){ e.preventDefault(); begin(); });
gate.addEventListener("click",function(){ begin(); });

/* came back through a door? stand where you left. */
(function restore(){
  var raw=null; try{ raw=sessionStorage.getItem("corridor"); }catch(e){}
  if(!raw) return;
  try{ var p=JSON.parse(raw); cam.x=p.x; cam.y=p.y; setDir(p.a); }catch(e){ return; }
  gate.style.display="none"; sig.classList.add("gone"); walking=true;
  screen.classList.add("lit");
  [].forEach.call(pads,function(pd){ pd.classList.remove("hid"); });
})();

/* ---------- loop ---------- */
function frame(now){
  now = now||0;
  var dt = lastTs ? Math.min(3, (now-lastTs)/16.667) : 1; lastTs = now;
  if(walking && !opening){
    var mv=MOVE*dt, tn=TURN*dt;
    if(keys["w"]||keys["arrowup"])   step(dirX*mv, dirY*mv);
    if(keys["s"]||keys["arrowdown"]) step(-dirX*mv,-dirY*mv);
    if(keys["a"]||keys["arrowleft"]) turn(-tn);
    if(keys["d"]||keys["arrowright"])turn(tn);
    if(keys["q"]) step(dirY*mv,-dirX*mv);
    if(keys["e"]) step(-dirY*mv, dirX*mv);
  }
  var d=findActive(), k=keyOf(d);
  if(k!==activeKey){ activeKey=k; active=d; if(d){ paintRead(d); if(walking) tick(); } }
  if(d && walking){
    var dy = d.end ? Math.max(0,(MH-1.4)-cam.y)*0.6 : Math.abs(cam.y-(d.y+0.5));
    var prox = Math.max(0.3, Math.min(1, 1-(dy/REACH)*0.85));
    read.style.opacity = prox; read.style.pointerEvents = "auto";
  } else {
    read.style.opacity = 0; read.style.pointerEvents = "none";
  }
  cast(); render(now||0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
