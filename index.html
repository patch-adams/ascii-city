<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii city — walkable proof</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080c'/%3E%3Ctext x='16' y='23' font-size='22' text-anchor='middle' fill='%2340e0d0' font-family='monospace'%3E%23%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#05080c;overflow:hidden}
  #screen{
    position:absolute;inset:0;margin:auto;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    color:#3fe0cf; background:#05080c;
    font-size:11px; line-height:0.92em; letter-spacing:0;
    white-space:pre; user-select:none; text-shadow:0 0 6px rgba(63,224,207,.25);
    display:flex;align-items:center;justify-content:center;
  }
  #hud{position:fixed;left:14px;bottom:12px;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;letter-spacing:.08em;color:#2b6f68}
  #hud b{color:#3fe0cf;font-weight:600}
  #title{position:fixed;left:14px;top:12px;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#2b6f68}
</style>
</head>
<body>
<pre id="screen"></pre>
<div id="title">ascii city · proof</div>
<div id="hud"><b>W A S D</b> / arrows — walk &amp; turn · <b>Q E</b> strafe</div>

<script>
(function(){
"use strict";

/* ---- the city: # = building, . = street ---- */
var MAP = [
"########################",
"#......................#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#......................#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#......................#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#......................#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#......................#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#.####.####.####.####..#",
"#......................#",
"#......................#",
"########################"
];
var MH = MAP.length, MW = MAP[0].length;
function wall(x,y){ if(x<0||y<0||x>=MW||y>=MH) return true; return MAP[y|0][x|0] === "#"; }

/* ---- screen buffer ---- */
var W = 104, H = 60;
var screen = document.getElementById("screen");

/* near -> far ramp for walls (dense to sparse) */
var SHADE = "@N#WH=+~:-,. ";
var VIEW = 22;                       // max view distance for shading

/* ---- player ---- */
var px = 2.5, py = 1.5;              // on the top avenue
var dx = 1, dy = 0;                  // facing +x
var plane = 0.66, planeX = 0, planeY = 0.66;

/* deterministic star for the night sky */
function star(x,y){ var h = ((x*73856093) ^ (y*19349663)) >>> 0; return (h % 29) === 0; }

function render(){
  var buf = new Array(H);
  for(var y=0;y<H;y++) buf[y] = new Array(W);

  for(var x=0; x<W; x++){
    var camX = 2*x/W - 1;
    var rdx = dx + planeX*camX;
    var rdy = dy + planeY*camX;

    var mapX = px|0, mapY = py|0;
    var ddx = Math.abs(1/rdx), ddy = Math.abs(1/rdy);
    var stepX, stepY, sdx, sdy;
    if(rdx<0){ stepX=-1; sdx=(px-mapX)*ddx; } else { stepX=1; sdx=(mapX+1-px)*ddx; }
    if(rdy<0){ stepY=-1; sdy=(py-mapY)*ddy; } else { stepY=1; sdy=(mapY+1-py)*ddy; }

    var side=0, hit=false, guard=0;
    while(!hit && guard++ < 400){
      if(sdx<sdy){ sdx+=ddx; mapX+=stepX; side=0; }
      else       { sdy+=ddy; mapY+=stepY; side=1; }
      if(wall(mapX,mapY)) hit=true;
    }
    var dist = (side===0) ? (sdx-ddx) : (sdy-ddy);
    if(dist<0.0001) dist=0.0001;

    var lh = Math.floor(H/dist);
    var start = ((H-lh)/2)|0, end = ((H+lh)/2)|0;

    var shadeIdx = Math.floor(dist/VIEW*(SHADE.length-1));
    if(side===1) shadeIdx++;                 // one darker on y-faces = edge contrast
    if(shadeIdx<0) shadeIdx=0; if(shadeIdx>=SHADE.length) shadeIdx=SHADE.length-1;
    var wc = SHADE[shadeIdx];

    for(var y=0;y<H;y++){
      var ch;
      if(y<start){                            // sky: sparse stars
        ch = star(x, y) ? "." : " ";
      } else if(y<=end){                       // building face, with faint window bands
        ch = wc;
        if(wc!==" " && ((y - start) % 4 === 1) && dist < VIEW*0.6) ch = (side===0? "=" : "-");
      } else {                                 // street, denser toward you
        var p = (y - H/2) / (H/2);
        ch = " .,:;+"[Math.min(5, Math.max(0, (p*6)|0))];
      }
      buf[y][x] = ch;
    }
  }
  var out = "";
  for(var yy=0; yy<H; yy++) out += buf[yy].join("") + "\n";
  screen.textContent = out;
}

/* ---- movement ---- */
var keys = {};
addEventListener("keydown", function(e){ keys[e.key.toLowerCase()]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"].indexOf(e.key.toLowerCase())>=0) e.preventDefault(); });
addEventListener("keyup", function(e){ keys[e.key.toLowerCase()]=false; });

function move(fx,fy){
  var nx = px + fx, ny = py + fy;
  if(!wall(nx + Math.sign(fx)*0.15, py)) px = nx;
  if(!wall(px, ny + Math.sign(fy)*0.15)) py = ny;
}
function rotate(a){
  var c=Math.cos(a), s=Math.sin(a);
  var ndx = dx*c - dy*s, ndy = dx*s + dy*c; dx=ndx; dy=ndy;
  var npx = planeX*c - planeY*s, npy = planeX*s + planeY*c; planeX=npx; planeY=npy;
}

var MOVE = 0.09, TURN = 0.05;
function tick(){
  if(keys["w"]||keys["arrowup"])    move(dx*MOVE, dy*MOVE);
  if(keys["s"]||keys["arrowdown"])  move(-dx*MOVE, -dy*MOVE);
  if(keys["a"]||keys["arrowleft"])  rotate(-TURN);
  if(keys["d"]||keys["arrowright"]) rotate(TURN);
  if(keys["q"]) move(dy*MOVE, -dx*MOVE);   // strafe left
  if(keys["e"]) move(-dy*MOVE, dx*MOVE);   // strafe right
  render();
  requestAnimationFrame(tick);
}
render();
tick();
})();
</script>
</body>
</html>
