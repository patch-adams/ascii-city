<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>a corridor</title>
<meta name="description" content="A corridor. The doors don't tell you what's behind them.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070607'/%3E%3Crect x='13' y='5' width='6' height='22' fill='%23e6c98a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{--ink:#e6c98a;--paper:#070607;--tint:230,201,138}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:absolute;inset:0;overflow:hidden;opacity:.10;transition:opacity 2.4s ease;cursor:crosshair}
  #stage.lit{opacity:1}
  #stage.locked{cursor:none}
  #cv{position:absolute;left:0;top:0;display:block}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.55) 2px 3px)}
  #panel{position:fixed;inset:-40px;z-index:3;pointer-events:none;box-shadow:inset 0 0 180px 60px rgba(0,0,0,.7)}
  #fade{position:fixed;inset:0;z-index:20;background:#050405;opacity:0;pointer-events:none;transition:opacity .5s ease}
  #cross{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;z-index:6;
    background:rgba(var(--tint),.7);pointer-events:none;opacity:0;transition:opacity .3s}
  #cross.on{opacity:1}

  /* the arrival — no words. A slit of light under a door. Touch it. */
  #gate{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:opacity 1.1s ease}
  #gate.gone{opacity:0;pointer-events:none}
  #gate .slit{width:3px;height:clamp(70px,18vh,150px);background:var(--ink);border-radius:2px;
    box-shadow:0 0 18px 4px rgba(230,201,138,.35),0 0 60px 14px rgba(230,201,138,.12);animation:breathe 4.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.55;transform:scaleY(.92)}50%{opacity:1;transform:scaleY(1)}}

  /* the door readout — only ever appears when you're alongside one */
  #read{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 142px);z-index:8;
    display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;pointer-events:none;text-align:center;max-width:88vw}
  #read .num{font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.42em;color:rgba(var(--tint),.7);text-indent:.42em}
  #read .mark{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:clamp(1.25rem,4.6vw,1.7rem);color:#efe7d2;line-height:1.1;
    text-shadow:0 0 18px rgba(var(--tint),.45)}
  #read .open{margin-top:6px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:#efe7d2;background:rgba(20,16,10,.55);border:1px solid rgba(var(--tint),.9);border-radius:999px;padding:12px 24px;cursor:pointer}
  #read .open:active{background:rgba(var(--tint),.26)}
  #read.shut .open{display:none}
  #read.shut .mark{color:rgba(233,226,212,.42)}

  /* touch controls — same pattern as city.html / hallway-walk.html */
  .pad{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:5;display:grid;gap:8px;opacity:.55;touch-action:none}
  .pad.left{left:16px;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);grid-template-areas:". up ." "lft dn rgt"}
  .pad.right{right:16px;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);grid-template-areas:". tt ." "tl . tr"}
  .btn{width:50px;height:50px;border:1px solid rgba(230,201,138,.55);border-radius:12px;background:rgba(127,127,127,.07);
    color:var(--ink);font-family:ui-monospace,monospace;font-size:18px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:.62}
  .btn:active,.btn.on{background:rgba(230,201,138,.24);opacity:1}
  .up{grid-area:up}.dn{grid-area:dn}.lft{grid-area:lft}.rgt{grid-area:rgt}.tl{grid-area:tl}.tt{grid-area:tt}.tr{grid-area:tr}
  .pad.hid{opacity:0;pointer-events:none}
  @media (min-width:900px){ .pad{opacity:.3} }

  /* ---------- the instrument panel ---------- */
  #gear{position:fixed;right:18px;top:16px;z-index:15;width:34px;height:34px;border-radius:50%;border:1px solid rgba(230,201,138,.35);
    background:rgba(10,8,6,.55);color:rgba(230,201,138,.7);font-family:"Space Mono",monospace;font-size:13px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 1s ease}
  #gear.on{opacity:.75}
  #gear:hover{opacity:1}
  #set{position:fixed;right:0;top:0;bottom:0;width:min(330px,92vw);z-index:14;background:rgba(8,7,6,.88);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border-left:1px solid rgba(230,201,138,.18);transform:translateX(104%);transition:transform .35s ease;
    overflow-y:auto;padding:22px 20px 40px;font-family:"Space Mono",monospace;color:#e6c98a;box-sizing:border-box;touch-action:pan-y}
  #set.open{transform:none}
  #set h1{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400;font-size:20px;margin:0 0 2px;color:#efe7d2}
  #set .sub{font-size:9px;letter-spacing:.22em;text-transform:uppercase;opacity:.5;margin-bottom:18px}
  #set h2{font-size:9px;letter-spacing:.24em;text-transform:uppercase;opacity:.55;margin:20px 0 8px;padding-bottom:5px;
    border-bottom:1px solid rgba(230,201,138,.14)}
  .row{display:grid;grid-template-columns:1fr 54px;align-items:center;gap:8px;margin:7px 0}
  .row label{font-size:10px;letter-spacing:.08em;display:flex;justify-content:space-between;grid-column:1/3}
  .row label b{font-weight:400;opacity:.55}
  .row input[type=range]{grid-column:1/3;width:100%;-webkit-appearance:none;appearance:none;height:2px;background:rgba(230,201,138,.25);outline:none}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#e6c98a;border:2px solid #0a0806;cursor:pointer}
  .row input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#e6c98a;border:2px solid #0a0806;cursor:pointer}
  .row select,.row input[type=text]{grid-column:1/3;background:rgba(20,16,10,.8);color:#e6c98a;border:1px solid rgba(230,201,138,.3);
    font-family:"Space Mono",monospace;font-size:11px;padding:6px 8px;border-radius:3px}
  .row input[type=text]{letter-spacing:.05em}
  .chip{display:inline-block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(230,201,138,.35);
    border-radius:999px;padding:6px 11px;margin:3px 4px 3px 0;cursor:pointer;opacity:.75}
  .chip:hover,.chip.on{opacity:1;background:rgba(230,201,138,.14)}
  #fps{position:fixed;left:18px;top:16px;z-index:15;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;
    color:rgba(230,201,138,.5);display:none;pointer-events:none}
  #fps.on{display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="scan"></div></div>
<div id="panel"></div>
<div id="cross"></div>
<div id="fps"></div>

<div id="read"><div class="num" id="rNum"></div><div class="mark" id="rMark"></div><button class="open" id="rOpen">open →</button></div>

<div class="pad left hid"><div class="btn up" data-k="w">▲</div><div class="btn lft" data-k="q">‹</div><div class="btn dn" data-k="s">▼</div><div class="btn rgt" data-k="e">›</div></div>
<div class="pad right hid"><div class="btn tt" data-k="w">▲</div><div class="btn tl" data-k="a">◀</div><div class="btn tr" data-k="d">▶</div></div>

<div id="gear" title="the instrument (tab)">⚙</div>
<div id="set">
  <h1>the instrument</h1>
  <div class="sub">every knob lands on the next frame</div>
  <div id="presets"></div>
  <div id="rows"></div>
  <h2>keep</h2>
  <span class="chip" id="pReset">reset</span><span class="chip" id="pCopy">copy json</span><span class="chip" id="pClose">close</span>
</div>

<div id="gate"><div class="slit"></div></div>
<div id="fade"></div>

<script>
(function(){
"use strict";
document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});

var stage=document.getElementById("stage"), cv=document.getElementById("cv"), gl=document.createElement("canvas"),
    scan=document.getElementById("scan"), gate=document.getElementById("gate"),
    fade=document.getElementById("fade"), read=document.getElementById("read"), sig=null,
    rNum=document.getElementById("rNum"), rMark=document.getElementById("rMark"), rOpen=document.getElementById("rOpen"),
    cross=document.getElementById("cross"), gear=document.getElementById("gear"), setEl=document.getElementById("set"),
    fpsEl=document.getElementById("fps"), pads=document.querySelectorAll(".pad");
var ctx=cv.getContext("2d"), gctx=gl.getContext("2d");

/* =====================================================================
   THE PARAM BUS — one dict, every surface reads it every frame.
   ===================================================================== */
var RAMPS=[
  {n:"near-dark", s:"#=+~:-.,·`  "},
  {n:"classic",   s:"@%#*+=-:.  "},
  {n:"fine",      s:"$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/|()1{}[]?-_+~<>i!lI;:,\"^`'.  "},
  {n:"blocks",    s:"█▓▒░∙·  "},
  {n:"dots",      s:"●◉◎○∘·   "},
  {n:"lines",     s:"║╫╪┼╬│┆┊·  "}
];
var DEF={
  cols:156, cellW:0.60, cellH:0.92, font:0,
  fov:0.90, wallH:2.50, view:28, fog:1.8,
  ramp:0, bright:1.0, sat:1.0, hue:0,
  lantern:1.0, reach:4.2, flicker:0.5, ambient:0.05,
  lightGap:4, lightPow:0, bleed:0.8,
  glow:0.55, blur:6, scan:0, grain:0.6, dust:0.0023,
  move:0.105, turn:0.045, sens:1.0, invert:0, pitch:1, anim:1, fps:0
};
var P={}; for(var k0 in DEF) P[k0]=DEF[k0];
try{ var sv=JSON.parse(localStorage.getItem("corridorP2")||"{}"); for(var k1 in sv) if(k1 in DEF) P[k1]=sv[k1]; }catch(e){}
var FONTS=['"SF Mono",ui-monospace,Menlo,Consolas,monospace','"Space Mono",monospace','"Courier New",Courier,monospace','monospace'];

/* slider spec: one row per key. struct = needs a regrid. */
var SPEC=[
  {h:"resolution"},
  {k:"cols", l:"columns", mn:40, mx:320, st:2, struct:1},
  {k:"cellW", l:"cell width", mn:0.40, mx:0.90, st:0.01, struct:1},
  {k:"cellH", l:"cell height", mn:0.70, mx:1.30, st:0.01, struct:1},
  {k:"font", l:"font", opts:["system mono","space mono","courier","browser mono"], struct:1},
  {h:"the room"},
  {k:"fov", l:"field of view", mn:0.40, mx:1.60, st:0.01},
  {k:"wallH", l:"wall height", mn:1.0, mx:5.0, st:0.05},
  {k:"view", l:"view distance", mn:6, mx:60, st:1},
  {k:"fog", l:"fog curve", mn:0.4, mx:3.0, st:0.05},
  {h:"the light"},
  {k:"ramp", l:"shade ramp", opts:RAMPS.map(function(r){return r.n;})},
  {k:"bright", l:"brightness", mn:0.2, mx:2.5, st:0.02},
  {k:"sat", l:"saturation", mn:0, mx:2, st:0.02},
  {k:"hue", l:"hue shift", mn:-180, mx:180, st:1},
  {k:"lantern", l:"lantern", mn:0, mx:2.5, st:0.05},
  {k:"reach", l:"lantern reach", mn:1, mx:12, st:0.1},
  {k:"flicker", l:"flicker", mn:0, mx:1, st:0.02},
  {k:"ambient", l:"ambient", mn:0, mx:1, st:0.01},
  {k:"lightGap", l:"ceiling lights every", mn:2, mx:12, st:1},
  {k:"lightPow", l:"ceiling light power", mn:0, mx:3, st:0.05},
  {k:"bleed", l:"door colour bleed", mn:0, mx:3, st:0.05},
  {h:"the glass"},
  {k:"glow", l:"glow", mn:0, mx:1.5, st:0.02},
  {k:"blur", l:"glow radius", mn:1, mx:24, st:1},
  {k:"scan", l:"scanlines", mn:0, mx:1, st:0.02},
  {k:"grain", l:"floor grain", mn:0, mx:2, st:0.02},
  {k:"dust", l:"dust", mn:0, mx:0.02, st:0.0002},
  {h:"the body"},
  {k:"move", l:"walk speed", mn:0.02, mx:0.4, st:0.005},
  {k:"turn", l:"key turn speed", mn:0.01, mx:0.15, st:0.005},
  {k:"sens", l:"mouse sensitivity", mn:0.2, mx:3, st:0.05},
  {k:"invert", l:"invert mouse y", opts:["no","yes"]},
  {k:"pitch", l:"look up / down", opts:["off","on"]},
  {k:"anim", l:"door faces move", opts:["still","alive"]},
  {k:"fps", l:"frame readout", opts:["hidden","shown"]}
];
var PRESETS={
  "near dark":{},
  "lit":{bright:1.4, lightPow:1.8, ambient:.5, glow:.8, view:34, fog:.9},
  "far lantern":{reach:8, lantern:1.4, ambient:.08},
  "pitch black":{ambient:0, reach:2.8, flicker:.8, dust:0},
  "crunchy":{cols:84, ramp:1, glow:.3, scan:.5, grain:1.2},
  "fine":{cols:260, ramp:2, glow:.35, scan:0, cellW:.55},
  "blocks":{cols:110, ramp:3, glow:.9, blur:10, scan:.4, bright:1.3},
  "phone":{cols:76, glow:.4, scan:0, dust:.001}
};

/* ---------- sound: only ever on your own action ---------- */
var AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,d,t,v){ var a=audio(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain(); o.type=t||"sine"; o.frequency.value=f;
  o.connect(g); g.connect(a.destination); var s=a.currentTime;
  g.gain.setValueAtTime(v||.1,s); g.gain.exponentialRampToValueAtTime(.0001,s+d); o.start(s); o.stop(s+d+.02); }
function tick(){ tone(150,.05,"sine",.035); }
function creak(){ tone(92,.34,"sine",.16); setTimeout(function(){ tone(64,.4,"sine",.12); },90); }

/* =====================================================================
   THE DOORS — each carries a number, at most a one-word mark, a colour,
   a face, and a note. Nothing about what's inside.
   ===================================================================== */
var DOORS=[
  {y:2, s:"L", n:"01", mark:"city",      url:"city.html",          face:"city",      tint:[150,190,235], hz:196, wave:"square"},
  {y:5, s:"R", n:"02", mark:"hallway",   url:"hallway-walk.html",  face:"hallway",   tint:[255,215,120], hz:220, wave:"sine"},
  {y:8, s:"L", n:"03", mark:"breath",    url:"hallway.html",       face:"breath",    tint:[170,235,220], hz:247, wave:"sine"},
  {y:11, s:"R", n:"04", mark:"routes",    url:"century.html",       face:"routes",    tint:[150,225,140], hz:262, wave:"triangle"},
  {y:14, s:"L", n:"05", mark:"press",     url:"registration.html",  face:"press",     tint:[225,95,80],   hz:294, wave:"square"},
  {y:17, s:"R", n:"06", mark:"image",     url:"image.html",         face:"image",     tint:[215,215,225], hz:330, wave:"sine"},
  {y:20, s:"L", n:"07", mark:"depth",     url:"depth.html",         face:"depth",     tint:[175,145,235], hz:349, wave:"triangle"},
  {y:23, s:"R", n:"08", mark:"gallery",   url:"tunnel.html",        face:"gallery",   tint:[245,235,210], hz:392, wave:"sine"},
  {y:26, s:"L", n:"09", mark:"film",      url:"film.html",          face:"film",      tint:[205,165,110], hz:440, wave:"sawtooth"},
  {y:29, s:"R", n:"10", mark:"screening", url:"theater.html",       face:"screening", tint:[225,65,75],   hz:494, wave:"square"},
  {y:32, s:"L", n:"11", mark:"presence",  url:"presence-demo.html", face:"presence",  tint:[240,150,175], hz:523, wave:"sine"},
  {y:35, s:"R", n:"12", mark:"creature",  url:"creature.html",      face:"creature",  tint:[165,240,95],  hz:587, wave:"triangle"},
  {y:38, s:"L", n:"13", mark:"study",     url:"study.html",         face:"study",     tint:[255,175,85],  hz:659, wave:"sine"},
  {y:41, s:"R", n:"14", mark:"portrait",  url:"mike.html",          face:"portrait",  tint:[235,185,145], hz:698, wave:"sine"},
  {y:44, s:"L", n:"16", mark:"who",       url:"self-portrait.html", face:"who",       tint:[255,255,255], hz:784, wave:"triangle"},
  {y:47, s:"R", n:"18", mark:"shelf",     url:"shelf.html",         face:"shelf",     tint:[195,135,85],  hz:880, wave:"sawtooth"},
  {y:50, s:"L", n:"15", mark:"ma/ré",     url:"https://sleepyplanet.studio/mare", out:true, face:"mare", tint:[95,165,225], hz:988, wave:"sine"},
  {y:53, s:"R", n:"17", mark:"walk",      url:"hall.html",          face:"walk",      tint:[135,175,125], hz:1047, wave:"triangle"}
];
var MW=7, MH=57;
/* a door is two cells wide and the full wall tall — a real door's proportions, and wide enough on screen to carry a face */
var DW=2;
/* the door at the far end. You can't see into it; it draws a card each visit. */
var END={y:MH-1, s:"E", mark:"unmarked", end:true, face:"unmarked", tint:[205,205,205], hz:131, wave:"sine"};

var MAP=[], ROWDOOR=[];
(function build(){
  for(var y=0;y<MH;y++){ MAP.push((y===0||y===MH-1) ? "#######".split("") : "#.....#".split("")); ROWDOOR.push(null); }
  DOORS.forEach(function(d){ for(var r=0;r<DW;r++){ MAP[d.y+r][d.s==="L"?0:MW-1] = d.dark ? "K" : "D"; ROWDOOR[d.y+r]=d; } d.cx = d.s==="L" ? 0.5 : MW-0.5; d.cy = d.y+DW/2; });
  MAP[MH-1][3]="X"; MAP[MH-1][4]="X"; END.cx=4; END.cy=MH-0.5;
})();
function cellAt(x,y){ if(x<0||y<0||x>=MW||y>=MH) return "#"; return MAP[y|0][x|0]; }
function solid(x,y){ var c=cellAt(x,y); return c!=="."; }

/* =====================================================================
   DOOR FACES — a 24x28 stencil per door, painted on the panel.
   cl: 1 = structure (resolves at middling range), 2 = detail (only up close)
   anim(tx,ty,t,T) may override a cell while you're near and the faces are alive.
   ===================================================================== */
var TW=34, TH=28;
var FONT={
 "0":["01110","10001","10011","10101","11001","10001","01110"],
 "1":["00100","01100","00100","00100","00100","00100","01110"],
 "2":["01110","10001","00001","00010","00100","01000","11111"],
 "3":["11111","00010","00100","00010","00001","10001","01110"],
 "4":["00010","00110","01010","10010","11111","00010","00010"],
 "5":["11111","10000","11110","00001","00001","10001","01110"],
 "6":["00110","01000","10000","11110","10001","10001","01110"],
 "7":["11111","00001","00010","00100","01000","01000","01000"],
 "8":["01110","10001","10001","01110","10001","10001","01110"],
 "9":["01110","10001","10001","01111","00001","00010","01100"],
 "?":["01110","10001","00001","00010","00100","00000","00100"]
};
function hash3(a,b,c){
  var n=(Math.imul(a,374761393)+Math.imul(b,668265263)+Math.imul(c,1442695040))>>>0;
  n=Math.imul(n^(n>>>13),1274126177)>>>0;
  return ((n^(n>>>16))>>>0)/4294967296;
}
function Tex(){ this.ch=[]; this.cl=[]; for(var y=0;y<TH;y++){ this.ch.push(new Array(TW).fill(" ")); this.cl.push(new Array(TW).fill(0)); } }
Tex.prototype.put=function(x,y,c,k){ x|=0; y|=0; if(x>=0&&x<TW&&y>=0&&y<TH){ this.ch[y][x]=c; this.cl[y][x]=k||1; } };
Tex.prototype.rect=function(x0,y0,x1,y1,k){ for(var x=x0;x<=x1;x++){ this.put(x,y0,"-",k); this.put(x,y1,"-",k); } for(var y=y0;y<=y1;y++){ this.put(x0,y,"|",k); this.put(x1,y,"|",k); } };
Tex.prototype.line=function(x0,y0,x1,y1,c,k){ var n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1; for(var i=0;i<=n;i++) this.put(Math.round(x0+(x1-x0)*i/n), Math.round(y0+(y1-y0)*i/n), c, k); };
Tex.prototype.glyph=function(g,ox,oy,c,k){ var f=FONT[g]; if(!f) return; for(var r=0;r<7;r++) for(var q=0;q<5;q++) if(f[r].charAt(q)==="1") this.put(ox+q,oy+r,c,k); };
Tex.prototype.frame=function(){ for(var y=1;y<TH;y++){ this.put(1,y,"|",1); this.put(TW-2,y,"|",1); } for(var x=1;x<TW-1;x++) this.put(x,0,"_",1); this.put(TW-4,(TH*0.62)|0,"o",1); };
Tex.prototype.number=function(num,oy){ if(!num) return; var ox=((TW-11)/2)|0; this.glyph(num.charAt(0),ox,oy,"#",2); this.glyph(num.charAt(1),ox+6,oy,"#",2); };

            if(hsh < L*gm*1.6){ ch = hsh<L*gm*0.5 ? ":" : "."; br=(fg*amb*0.5+L)*0.9; }
          }
          if(ch!==" "){ bleedAt(fx,fy); if(bl_w>0){ tw=bl_w*0.85; tr=bl_d.tint[0]; tg=bl_d.tint[1]; tb=bl_d.tint[2]; } }
        }
      } else {
        var d=cD[x], cell=cCell[x], v=(y-s)/Math.max(1,e-s), bias=cSide[x]===1?1:0;
        var tx=(cU[x]*TW)|0, ty=(v*TH)|0;
        if(tx<0)tx=0; if(tx>=TW)tx=TW-1; if(ty<0)ty=0; if(ty>=TH)ty=TH-1;
        var hx=cHx[x], hy=cHy[x], Lw=lightAt(hx,hy)*0.85, fgw=fogAt(d);
        br=fgw*amb+Lw;
        if(cell==="#"){
          /* joints every world unit. Vertical, so they converge with the corridor
             instead of banding across it the way horizontal courses do. */
          ch = (tx<1||tx>TW-2) ? litShade(d,bias,br) : litShade(d,bias+1,br);
          bleedAt(hx,hy); if(bl_w>0){ tw=bl_w; tr=bl_d.tint[0]; tg=bl_d.tint[1]; tb=bl_d.tint[2]; }
        } else {
          var dr=doorFor(cRow[x]), tex=dr.tex, k=tex.cl[ty][tx];
          ch=litShade(d,bias+4,br); br*=0.55;                         // panel, recessed from the wall, dimmer than its frame
          if(k===1 && d<15){ ch=tex.ch[ty][tx]; br/=0.55; }            // structure
          else if(k===2 && d<7.5){ ch=tex.ch[ty][tx]; br/=0.55; }      // detail — only up close
          if(alive && dr.anim && d<12){ var ov=dr.anim(tx,ty,t,tex); if(ov!==null){ ch=ov; if(k===0) br=fgw*amb+Lw; } }
          if(cell==="D" && v>0.945){ ch=LIGHT[Math.min(LIGHT.length-1, 1+((d/VIEW)*9|0))]; br=0.5+fgw; }   // light under the door
          tw=Math.min(1, 0.55+0.45*fgw); tr=dr.tint[0]; tg=dr.tint[1]; tb=dr.tint[2];
          if(k>0) br+=0.12;
          /* opening: the face falls away from the centre outward, and what's behind it is light */
          if(od===dr && ap>0){ var rr=rad(tx,ty,TW/2,TH/2), apr=ap*26; if(rr<apr){ var q=rr/apr;
            ch = q>0.86 ? "#" : LIGHT[Math.min(LIGHT.length-1,(q*5)|0)]; br=1.0+ap*0.8; tw=1; } }
        }
      }
      if(ch!==" " && br*br0<FLOOR && fl===0) ch=" ";                                          // below the visibility floor, nothing
      if(ch===" " && dustT>0 && noise(x,y,tf)>1-dustT){ ch="·"; br=0.35*Math.min(1,0.3+lightAt(cam.x,cam.y)); }   // dust
      var o=(y*W+x)*4;
      if(ch===" "){ data[o]=0; data[o+1]=0; data[o+2]=0; data[o+3]=255; continue; }
      var r=bx,gg=by,b=bz;
      if(tw>0){ r+= (tr-r)*tw; gg+=(tg-gg)*tw; b+=(tb-b)*tw; }
      if(fl>0){ r+=(ft[0]-r)*fl*0.8; gg+=(ft[1]-gg)*fl*0.8; b+=(ft[2]-b)*fl*0.8; br+=fl*0.4; }   // the door's colour floods the hall
      if(sat!==1){ var lum=r*.3+gg*.59+b*.11; r=lum+(r-lum)*sat; gg=lum+(gg-lum)*sat; b=lum+(b-lum)*sat; }
      var m=br*br0; if(m>1.6) m=1.6;
      r*=m; gg*=m; b*=m;
      data[o]=r>255?255:r; data[o+1]=gg>255?255:gg; data[o+2]=b>255?255:b; data[o+3]=255;
      var idx=CIDX[ch]; if(idx===undefined) idx=CIDX["#"];
      ctx.drawImage(atlas, idx*GW, 0, GW, GH, x*GW, y*GH, GW, GH);
    }
  }
  /* colour: white glyphs × the per-cell colour map, one draw */
  col.getContext("2d").putImageData(colData,0,0);
  ctx.globalCompositeOperation="multiply"; ctx.imageSmoothingEnabled=false;
  ctx.drawImage(col,0,0,W,H,0,0,cv.width,cv.height);
  ctx.globalCompositeOperation="source-over";
  /* the glass: a soft copy of the frame added back onto itself — downscale, then upscale with
     smoothing, which is a blur without a CSS overlay (an overlay is a box; this isn't) */
  if(P.glow>0){
    var f=2+P.blur*0.7, gw=Math.max(4,(cv.width/f)|0), gh=Math.max(4,(cv.height/f)|0);
    if(gl.width!==gw||gl.height!==gh){ gl.width=gw; gl.height=gh; }
    gctx.imageSmoothingEnabled=true; gctx.clearRect(0,0,gw,gh); gctx.drawImage(cv,0,0,gw,gh);
    ctx.globalCompositeOperation="lighter"; ctx.imageSmoothingEnabled=true; ctx.globalAlpha=Math.min(1,P.glow*0.8);
    ctx.drawImage(gl,0,0,gw,gh,0,0,cv.width,cv.height);
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  }
  scan.style.opacity=P.scan;
}

/* ---------- which door you're alongside ---------- */
var REACH=1.75, active=null, activeKey="";
function findActive(){
  if(cam.y > MH-3.0) return END;
  var best=null, bd=1e9;
  for(var i=0;i<DOORS.length;i++){
    var dy=Math.abs(cam.y-DOORS[i].cy);
    if(dy<REACH && dy<bd){ bd=dy; best=DOORS[i]; }
  }
  return best;
}
function keyOf(d){ return d ? (d.end?"end":String(d.y)) : ""; }
function paintRead(d){
  read.classList.toggle("shut", !!(d&&d.dark));
  if(!d){ document.documentElement.style.setProperty("--tint","230,201,138"); return; }
  document.documentElement.style.setProperty("--tint", d.tint.join(","));
  if(d.end){ rNum.textContent="⁂"; rMark.textContent="unmarked"; rOpen.textContent="open →"; }
  else if(d.dark){ rNum.textContent="——"; rMark.textContent="unlit"; }
  else { rNum.textContent=d.n; rMark.textContent=d.mark; rOpen.textContent = d.out ? "open ↗" : "open →"; }
}

/* ---------- opening ---------- */
var opening=false, openD=null, openAt=0, openAp=0, flood=0;
function remember(){ try{ sessionStorage.setItem("corridor",
  JSON.stringify({x:cam.x,y:cam.y,a:heading()})); }catch(e){} }
function openDoor(){
  var d=active; if(!d||opening||d.dark) return;
  audio(); creak(); if(d.hz) setTimeout(function(){ tone(d.hz/2,.5,d.wave,.08); },140);
  if(d.out){
    remember();
    var a=document.createElement("a");
    a.href=d.url; a.target="_blank"; a.rel="noopener noreferrer";
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  var url=d.url;
  if(d.end){
    var pool=DOORS.filter(function(k){ return k.url && !k.out; });
    url = pool[(Math.random()*pool.length)|0].url;
  }
  /* the choreography: glance to the door, the face falls away into light, the colour
     floods the hall, then the cut — to the door's own colour, not to black */
  opening=true; openD=d; openAt=performance.now(); remember();
  if(document.pointerLockElement) document.exitPointerLock();
  fade.style.background="rgb("+d.tint.join(",")+")";
  setTimeout(function(){ fade.style.opacity=1; },1000);
  setTimeout(function(){ location.href=url; },1480);
}
rOpen.addEventListener("click",function(e){ e.preventDefault(); openDoor(); });

/* ---------- input: keys ---------- */
var keys={}, walking=false;
addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(k==="tab"){ e.preventDefault(); togglePanel(); return; }
  if(setEl.classList.contains("open") && k==="escape"){ togglePanel(false); return; }
  if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="SELECT")) return;
  if(!walking){ e.preventDefault(); begin(); return; }
  if(k==="enter"||k==="o"){ e.preventDefault(); openDoor(); return; }
  if(k==="l"){ toggleLock(); return; }
  keys[k]=true; if(k.indexOf("arrow")===0||k===" ") e.preventDefault();
});
addEventListener("keyup",function(e){ keys[e.key.toLowerCase()]=false; });
[].forEach.call(document.querySelectorAll(".btn"),function(b){
  var k=b.dataset.k;
  var on=function(e){ e.preventDefault(); e.stopPropagation(); audio(); keys[k]=true; b.classList.add("on"); };
  var off=function(e){ e.preventDefault(); keys[k]=false; b.classList.remove("on"); };
  b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off);
  b.addEventListener("pointerleave",off); b.addEventListener("pointercancel",off);
});

/* ---------- input: the mouse, like a game ----------
   drag to look (mouse or finger); double-click or L to lock the pointer; wheel walks;
   a plain click alongside a door opens it. */
var drag=null, SENS=0.0032;
function look(dx,dy){
  setDir(heading()+dx*SENS*P.sens);
  if(P.pitch){ pitch += (P.invert?1:-1)*dy*SENS*P.sens*0.9; if(pitch>0.7) pitch=0.7; if(pitch<-0.7) pitch=-0.7; }
}
stage.addEventListener("pointerdown",function(e){
  if(!walking) return; if(e.button!==undefined&&e.button!==0) return;
  drag={id:e.pointerId, x:e.clientX, y:e.clientY, moved:0};
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener("pointermove",function(e){
  if(document.pointerLockElement===stage){ look(e.movementX||0, e.movementY||0); return; }
  if(!drag || e.pointerId!==drag.id) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; drag.moved+=Math.abs(dx)+Math.abs(dy);
  var mul = e.pointerType==="touch" ? 1.6 : 1;
  look(dx*mul, dy*mul);
});
function endDrag(e){
  if(!drag || e.pointerId!==drag.id) return;
  if(drag.moved<6 && active && walking && e.type==="pointerup"){ openDoor(); }
  drag=null;
}
stage.addEventListener("pointerup",endDrag); stage.addEventListener("pointercancel",endDrag);
stage.addEventListener("dblclick",function(e){ e.preventDefault(); if(walking && e.pointerType!=="touch") toggleLock(); });
stage.addEventListener("wheel",function(e){ if(!walking) return; e.preventDefault();
  var mv=Math.max(-0.6,Math.min(0.6,-e.deltaY*0.004)); step(dirX*mv, dirY*mv); },{passive:false});
function toggleLock(){
  if(document.pointerLockElement===stage){ document.exitPointerLock(); }
  else { try{ var p=stage.requestPointerLock({unadjustedMovement:true}); if(p&&p.catch) p.catch(function(){ stage.requestPointerLock(); }); }catch(err){ stage.requestPointerLock(); } }
}
document.addEventListener("pointerlockchange",function(){
  var on=document.pointerLockElement===stage; stage.classList.toggle("locked",on); cross.classList.toggle("on",on);
});

function step(fx,fy){
  var nx=cam.x+fx, ny=cam.y+fy; walkPhase += Math.sqrt(fx*fx+fy*fy)*5.5;
  if(!solid(nx+Math.sign(fx)*0.22, cam.y)) cam.x=nx;
  if(!solid(cam.x, ny+Math.sign(fy)*0.22)) cam.y=ny;
}
function turn(a){ setDir(heading()+a); }
var lastTs=0;

/* =====================================================================
   THE INSTRUMENT — sliders built from SPEC, persisted, every one live.
   ===================================================================== */
var rows=document.getElementById("rows"), presetsEl=document.getElementById("presets"), inputs={};
function fmt(v,st){ return st>=1 ? String(Math.round(v)) : (st>=0.01 ? Number(v).toFixed(2) : Number(v).toFixed(4)); }
function apply(k,v,fromUI){
  P[k]=v; if(inputs[k]&&!fromUI){ inputs[k].el.value=v; }
  if(inputs[k]&&inputs[k].val) inputs[k].val.textContent=fmt(v,inputs[k].st);
  if(inputs[k]&&inputs[k].struct) sizeGrid();
  if(k==="fps") fpsEl.classList.toggle("on",!!v);
  save();
}
var saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(function(){ try{ localStorage.setItem("corridorP2",JSON.stringify(P)); }catch(e){} },80); }
SPEC.forEach(function(sp){
  if(sp.h){ var h=document.createElement("h2"); h.textContent=sp.h; rows.appendChild(h); return; }
  var row=document.createElement("div"); row.className="row";
  var lab=document.createElement("label"); lab.innerHTML=sp.l+" <b></b>"; row.appendChild(lab);
  var el;
  if(sp.opts){ el=document.createElement("select"); sp.opts.forEach(function(o,i){ var op=document.createElement("option"); op.value=i; op.textContent=o; el.appendChild(op); });
    el.value=P[sp.k]|0; el.addEventListener("change",function(){ apply(sp.k, el.value|0, true); }); lab.querySelector("b").remove(); }
  else { el=document.createElement("input"); el.type="range"; el.min=sp.mn; el.max=sp.mx; el.step=sp.st; el.value=P[sp.k];
    el.addEventListener("input",function(){ apply(sp.k, parseFloat(el.value), true); }); }
  row.appendChild(el); rows.appendChild(row);
  inputs[sp.k]={el:el, val:lab.querySelector("b"), st:sp.st, struct:sp.struct};
  if(inputs[sp.k].val) inputs[sp.k].val.textContent=fmt(P[sp.k],sp.st);
});
Object.keys(PRESETS).forEach(function(name){
  var c=document.createElement("span"); c.className="chip"; c.textContent=name;
  c.addEventListener("click",function(){ var pr=PRESETS[name]; for(var k in DEF){ apply(k, (k in pr)?pr[k]:DEF[k]); } });
  presetsEl.appendChild(c);
});
document.getElementById("pReset").addEventListener("click",function(){ for(var k in DEF) apply(k,DEF[k]); });
document.getElementById("pCopy").addEventListener("click",function(){ var s=JSON.stringify(P); try{ navigator.clipboard.writeText(s); }catch(e){} this.textContent="copied"; var me=this; setTimeout(function(){ me.textContent="copy json"; },1200); });
document.getElementById("pClose").addEventListener("click",function(){ togglePanel(false); });
function togglePanel(force){ var on = force===undefined ? !setEl.classList.contains("open") : force; setEl.classList.toggle("open",on); if(on && document.pointerLockElement) document.exitPointerLock(); }
gear.addEventListener("click",function(){ togglePanel(); });
setEl.addEventListener("pointerdown",function(e){ e.stopPropagation(); });
fpsEl.classList.toggle("on",!!P.fps);

/* ---------- the arrival ---------- */
function begin(){
  if(walking) return;
  walking=true; audio();
  gate.classList.add("gone"); stage.classList.add("lit"); gear.classList.add("on");
  [].forEach.call(pads,function(p){ p.classList.remove("hid"); });
  setTimeout(function(){ gate.style.display="none"; },1200);
}
gate.addEventListener("click",function(){ begin(); });

sizeGrid(); recomputeProj(); setDir(Math.PI/2);

/* came back through a door? stand where you left. */
(function restore(){
  var raw=null; try{ raw=sessionStorage.getItem("corridor"); }catch(e){}
  if(!raw) return;
  try{ var p=JSON.parse(raw); cam.x=p.x; cam.y=p.y; setDir(p.a); }catch(e){ return; }
  gate.style.display="none"; walking=true;
  stage.classList.add("lit"); gear.classList.add("on");
  [].forEach.call(pads,function(pd){ pd.classList.remove("hid"); });
})();

/* ---------- loop ---------- */
var fpsAcc=0, fpsN=0, fpsLast=0;
function tickFrame(now,dt){
  if(walking && !opening){
    var mv=P.move*dt, tn=P.turn*dt;
    if(keys["w"]||keys["arrowup"])   step(dirX*mv, dirY*mv);
    if(keys["s"]||keys["arrowdown"]) step(-dirX*mv,-dirY*mv);
    if(keys["a"]||keys["arrowleft"]) turn(-tn);
    if(keys["d"]||keys["arrowright"])turn(tn);
    if(keys["q"]) step(dirY*mv,-dirX*mv);
    if(keys["e"]) step(-dirY*mv, dirX*mv);
    if(!P.pitch && pitch!==0) pitch*=0.9;
  }
  if(opening && openD){
    var el=(now-openAt)/1000, ta=Math.atan2(openD.cy-cam.y, openD.cx-cam.x), h=heading(),
        diff=Math.atan2(Math.sin(ta-h),Math.cos(ta-h));
    setDir(h+diff*Math.min(1,0.14*dt)); pitch*=Math.pow(0.85,dt);                 // the glance
    openAp=Math.max(0,Math.min(1,(el-0.12)/0.62)); flood=Math.max(0,Math.min(1,(el-0.45)/0.6));
  }
  var d=findActive(), k=keyOf(d);
  if(k!==activeKey){ activeKey=k; active=d; paintRead(d); if(d&&walking){ tick(); if(d.hz) setTimeout(function(){ tone(d.hz,.09,d.wave,.03); },60); } }
  if(d && walking && !opening){
    var dy = d.end ? Math.max(0,(MH-1.4)-cam.y)*0.6 : Math.abs(cam.y-d.cy);
    var prox = Math.max(0.3, Math.min(1, 1-(dy/REACH)*0.85));
    read.style.opacity = prox; read.style.pointerEvents = "auto";
  } else {
    read.style.opacity = 0; read.style.pointerEvents = "none";
  }
  render(now);
}
function frame(now){
  now = now||0;
  var dt = lastTs ? Math.min(3, (now-lastTs)/16.667) : 1; lastTs = now;
  tickFrame(now,dt);
  if(P.fps){ fpsAcc+=now-fpsLast; fpsN++; if(fpsAcc>500){ fpsEl.textContent=Math.round(1000*fpsN/fpsAcc)+" fps · "+W+"×"+H+" · "+(W*H)+" cells"; fpsAcc=0; fpsN=0; } }
  fpsLast=now;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* keep breathing on a second monitor */
setInterval(function(){ if(document.hidden){ var n=performance.now(); tickFrame(n,1); } },250);

/* harness — drive it without watching it */
window.__x={P:P, cam:cam, DOORS:DOORS, step:function(n,dt){ for(var i=0;i<(n||1);i++) tickFrame(performance.now(),dt||1); },
  walk:function(n){ for(var i=0;i<n;i++) step(dirX*P.move, dirY*P.move); }, begin:begin, look:look, open:openDoor, setDir:setDir,
  goto:function(y){ cam.x=3.5; cam.y=y; }, lamp:function(){ return {x:lampX,y:lampY,i:lampI,sway:sway}; },
  openState:function(){ return {opening:opening, ap:openAp, flood:flood}; }, size:function(){ return {W:W,H:H,FS:FS}; }, toggle:togglePanel};
})();
</script>
</body>
</html>
