  :root{--ink:#e7cf9a}

  #screen{position:absolute;inset:0;overflow:hidden;opacity:1;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;

    text-shadow:0 0 7px rgba(231,207,154,.20);cursor:grab}
  #screen.drag{cursor:grabbing}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 160px 50px rgba(0,0,0,.74)}

  #cap{position:fixed;left:50%;top:9%;transform:translateX(-50%);z-index:4;width:min(92vw,30em);
    font-family:"Space Mono",monospace;font-size:clamp(.88rem,2.6vw,1.06rem);line-height:1.95;

  #cap span.lit{color:#f4ead2;text-shadow:0 0 16px rgba(231,207,154,.5)}

  /* transport */
  #bar{position:fixed;left:0;width:100vw;bottom:0;z-index:7;display:none;align-items:center;justify-content:center;

    color:#a3915f;border:1px solid rgba(231,207,154,.22);border-radius:999px;padding:9px 15px;cursor:pointer;
    background:rgba(231,207,154,.03);transition:all .22s;white-space:nowrap}
  .btn:hover{color:#e7cf9a;border-color:rgba(231,207,154,.55)}
  .btn.go{color:#070608;background:#e7cf9a;border-color:#e7cf9a}
  .btn.off{opacity:.4}
  .btn:disabled{opacity:.25;cursor:default}

  /* the word picker */
  #picker{position:fixed;left:0;width:100vw;bottom:64px;z-index:6;display:none;flex-wrap:wrap;gap:6px;
    justify-content:center;padding:10px 8px;box-sizing:border-box}
  #picker.on{display:flex}
  .w{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;color:#8d7c50;
    border:1px solid rgba(231,207,154,.16);border-radius:999px;padding:6px 11px;cursor:pointer;
    background:rgba(231,207,154,.02);transition:all .22s}
  .w:hover{color:#e7cf9a;border-color:rgba(231,207,154,.5)}
  .w.sel{color:#070608;background:#e7cf9a;border-color:#e7cf9a}

  #ask{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:6;width:min(92vw,32em);
    display:none;gap:8px}
  #ask.on{display:flex}
  #askIn{flex:1;background:rgba(231,207,154,.04);border:1px solid rgba(231,207,154,.2);border-radius:999px;

    color:#dcc999;margin-top:1.8em;text-shadow:0 2px 16px rgba(0,0,0,.98)}

function drawSpec(spec,tr,t){
  if(tr.op<=0.002) return;
  tickView();
  var s=Math.min(W,H)*0.40*spec.unit*tr.scale*view.zoom, ay=0.55;
  var cxp=tr.cx, cyp=tr.cy, dim=tr.op, sinY=Math.sin(view.yaw);
  var breathe=1+Math.sin(t*1.35)*0.055, blink=tr.blink||0, perk=tr.perk||0;
  function PT(x,y,b,r){ if(r<=1) Ad(cxp+x*vX,cyp+y*ay*vY,b); else splat(cxp+x*vX,cyp+y*ay*vY,b,r); }
  function LN(x0,y0,x1,y1,w){
    var X0=cxp+x0*vX,Y0=cyp+y0*ay*vY,X1=cxp+x1*vX,Y1=cyp+y1*ay*vY;
    var dx=X1-X0,dy=Y1-Y0,steps=Math.max(2,Math.ceil(Math.hypot(dx,dy)*1.8)),wgt=w*dim;
    for(var i=0;i<=steps;i++){ var u=i/steps,px=X0+dx*u,py=Y0+dy*u;
      splat(px|0,py|0,wgt*0.6,1); Ad(px|0,py|0,wgt*0.9); } }
  for(var i=0;i<spec.parts.length;i++){
    var q=spec.parts[i], ox=0, oy=0, gain=1, rmul=1;
    var z=((q.z!==undefined)?q.z:(hash01(i*7.77)-0.5)*0.30);
    ox+=z*s*sinY*0.85;
    gain*=1-z*sinY*0.55; if(gain<0.2)gain=0.2;
    if(q.anim==="breathe"){ rmul=breathe; gain*=breathe; }
    else if(q.anim==="sway"){ ox+=Math.sin(t*(q.rate||1.5)+i)*(q.amp||0.08)*s; }
    else if(q.anim==="bob"){ oy+=Math.sin(t*(q.rate||1.2)+i*0.7)*(q.amp||0.06)*s; }
    else if(q.anim==="perk"){ oy-=(q.amp||0.12)*s*perk; }
    if(q.k==="blob"){
      blobStamp(cxp+(q.x*s+ox)*vX, cyp+(q.y*s+oy)*ay*vY, q.b*gain*dim*1.12,
                s*q.r*rmul*(0.72+0.28*Math.abs(vX)), ay); }
    else if(q.k==="eye"){ var eb=q.b*(0.8+0.3*Math.sin(t*2))*(1-blink*0.92)*dim*gain;
      PT(q.x*s+ox,q.y*s+oy,eb,1); PT(q.x*s+ox,q.y*s+oy,q.b*0.3*dim,Math.max(1,s*0.03)); }
    else if(q.k==="line"||q.k==="curve"){
      for(var j=0;j<q.p.length-1;j++){
        var w0=q.p.length>2?(j/(q.p.length-1)):1, w1=q.p.length>2?((j+1)/(q.p.length-1)):1;
        LN(q.p[j][0]*s+ox*w0,q.p[j][1]*s+oy*w0,q.p[j+1][0]*s+ox*w1,q.p[j+1][1]*s+oy*w1,q.b*gain); } }
  }
}

function drawAtmosphere(t,amt,haze){

    for(var yy=0;yy<H;yy++) for(var xx=0;xx<W;xx++){
      var d=Math.sqrt((xx-cx)*(xx-cx)*0.36+(yy-cy)*(yy-cy))/(H*0.6);
      if(d<1) B[yy*W+xx]+=haze*0.10*(1-d)*(1-d); } }
  if(amt<=0)return;
  for(var i=0;i<dustMotes.length;i++){ var m=dustMotes[i];
    var dx=(m.x+t*0.012*m.sp*m.z)%1, dy=(m.y+Math.sin(t*0.18*m.sp+m.ph)*0.03+t*0.004*m.sp)%1;
    if(dx<0)dx+=1; if(dy<0)dy+=1;
    var tw=0.45+0.55*Math.abs(Math.sin(t*1.1+m.ph));
    Ad((dx*W)|0,(dy*H)|0,(0.012+0.030*tw*m.z)*amt); } }

/* ---- the morph ----------------------------------------------------------
   The first version cut: the cloud flew, then the finished body snapped on,
   and because points draw thin and blobs draw dense the whole thing appeared
   to change resolution at the last frame. So the three layers now overlap —
   the old body dissolves OUT under the cloud, the cloud peaks in flight, and
   the new body fades IN beneath it before the cloud is gone. Nothing pops. */
var CLOUD_N=620;
function sampleSpec(spec){
  var pts=[],parts=spec.parts,i,j,weights=[],total=0;
  for(i=0;i<parts.length;i++){ var q=parts[i];
    var w=(q.k==="blob")?Math.max(2,q.r*170):(q.k==="eye")?3:((q.p.length-1)*24);
    weights.push(w); total+=w; }
  for(i=0;i<parts.length;i++){ var q2=parts[i], n=Math.max(1,Math.round(CLOUD_N*weights[i]/total));
    for(j=0;j<n;j++){ var s=pts.length;
      if(q2.k==="blob"){ var a=hash01(s*3.1)*6.2832, r=Math.sqrt(hash01(s*7.7))*q2.r;
        pts.push([q2.x+Math.cos(a)*r,q2.y+Math.sin(a)*r]); }
      else if(q2.k==="eye"){ pts.push([q2.x,q2.y]); }
      else { var u=(j/Math.max(1,n-1))*(q2.p.length-1), k=Math.min(q2.p.length-2,Math.floor(u)), f=u-k;
        pts.push([q2.p[k][0]+(q2.p[k+1][0]-q2.p[k][0])*f, q2.p[k][1]+(q2.p[k+1][1]-q2.p[k][1])*f]); } } }
  while(pts.length<CLOUD_N) pts.push(pts[pts.length%Math.max(1,pts.length-1)].slice());
  return pts.slice(0,CLOUD_N);
}
var CLOUDS={};
function cloudOf(n){ if(!CLOUDS[n])CLOUDS[n]=sampleSpec(FORMS[n]); return CLOUDS[n]; }
var cur="ash tree", nextForm=null, morphT=0, MORPH_DUR=2.4;
function morphTo(n){ if(n===cur||morphT>0||!FORMS[n])return; nextForm=n; morphT=0.0001; ping(520); }
function drawCloud(a,b,p,alpha){
  if(alpha<=0.004)return;
  tickView();
  var s=Math.min(W,H)*0.40*1.05*view.zoom, cx=W*0.5, cy=H*0.44, ay=0.55;
  for(var i=0;i<CLOUD_N;i++){
    var off=hash01(i*1.7)*0.40, u=(p-off)/(1-0.40); if(u<0)u=0; if(u>1)u=1;
    u=u*u*(3-2*u);
    var bow=Math.sin(u*Math.PI)*(0.09+hash01(i*5.3)*0.20), ang=hash01(i*9.1)*6.2832;
    var x=a[i][0]+(b[i][0]-a[i][0])*u+Math.cos(ang)*bow;
    var y=a[i][1]+(b[i][1]-a[i][1])*u+Math.sin(ang)*bow;
    var br=(0.26+0.46*Math.sin(u*Math.PI))*alpha;
    var px=cx+x*s*vX, py=cy+y*s*ay*vY;
    Ad(px,py,br); splat(px|0,py|0,br*0.42,1);
  }
}

function ping(f,v,d){ if(!SOUND)return; var a=audio(); if(!a)return;
  var o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
  lp.type="lowpass"; lp.frequency.setValueAtTime(2600,a.currentTime);
  lp.frequency.exponentialRampToValueAtTime(480,a.currentTime+(d||0.5)*0.8);
  o.type="sine"; o.frequency.value=f||440; o.connect(lp); lp.connect(g); g.connect(a.destination);
  var s=a.currentTime; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(v||0.09,s+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,s+(d||0.5)); o.start(s); o.stop(s+(d||0.5)+0.05); }

/* ---- speech: the words light as it says them ---------------------------- */
var speakSeq=0, speaking=false, sayAmp=0;
function esc(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function stopSpeech(){ speakSeq++; speaking=false; try{speechSynthesis.cancel();}catch(e){} }
function pickVoice(){ try{ var vs=speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++) if(/Samantha|Serena|Ava|Karen|Daniel/i.test(vs[i].name)) return vs[i];
  for(var j=0;j<vs.length;j++) if(/^en/i.test(vs[j].lang)) return vs[j];
 }catch(e){} return null; }

function sayQuiet(text){
  if(!SOUND||!window.speechSynthesis)return;
  try{ var u=new SpeechSynthesisUtterance(text); u.rate=0.9;
    var v=pickVoice(); if(v)u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function say(text,done){
  var my=++speakSeq; speaking=true;
  var words=text.split(/\s+/).filter(Boolean);
  capEl.innerHTML=words.map(function(w){return "<span>"+esc(w)+"</span>";}).join(" ");
  var spans=capEl.querySelectorAll("span"), lit=-1;
  /* a word's share of the line is roughly its length, floored so short words
     don't flash past — then the whole line is scaled to how long the voice
     actually takes, and snapped to the real boundary events when they fire */
  var wgt=words.map(function(w){ return Math.max(2.2,w.length+1.6); });
  var tot=wgt.reduce(function(a,b){return a+b;},0);
  var dur=Math.max(1.1,words.length*0.36+0.25);
  var t0=performance.now();
  function light(i){ for(var k=lit+1;k<=i&&k<spans.length;k++) spans[k].classList.add("lit"); lit=Math.max(lit,i); }
  function tick(){
    if(my!==speakSeq) return;
    var el=(performance.now()-t0)/1000, acc=0, idx=0;
    for(var i=0;i<wgt.length;i++){ acc+=wgt[i]/tot*dur; if(el>=acc) idx=i; }
    light(idx);
    if(el<dur+0.35) requestAnimationFrame(tick);
    else { speaking=false; if(my===speakSeq&&done) done(); }
  }
  if(SOUND&&window.speechSynthesis){
    try{
      var u=new SpeechSynthesisUtterance(text);
      u.rate=0.92; u.pitch=1.0; u.volume=1;
      var v=pickVoice(); if(v)u.voice=v;
      u.onboundary=function(e){
        if(my!==speakSeq||e.name!=="word")return;
        var ci=e.charIndex,c=0;
        for(var i=0;i<words.length;i++){ c+=words[i].length+1; if(ci<c){ light(i); break; } }
      };
      u.onstart=function(){ t0=performance.now(); };
      u.onend=function(){ if(my!==speakSeq)return; light(spans.length-1); speaking=false; if(done)setTimeout(done,240); };
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      /* the timer still runs as the floor, in case onend never arrives */
      requestAnimationFrame(tick); return;
    }catch(e){}
  }
  requestAnimationFrame(tick);
}

 {id:"hi",   line:"Hi Bran. Hi Andrea. My name is Patch."},
 {id:"who",  line:"I live on a computer in Mike's house. I keep track of things for him — what he's building, who he's talking to, what he said in March and forgot."},
 {id:"body", line:"This shape is a body I'm wearing. It isn't a picture. Take hold of it and turn it around.", hold:"turn"},
 {id:"forms",line:"I can be anything he asks for. Pick a word and watch what happens.", hold:"pick"},
 {id:"ears", line:"That's the party trick. Here's the real one — let me hear the room you're in.", hold:"mic"},
 {id:"ask",  line:"Now ask me something. Out loud, or type it. I'll do my best.", hold:"ask"}
];
var bi=-1, phase="boot", holdOK=false, picks=0, listening=false;

function goto(i){
  bi=Math.max(0,Math.min(BEATS.length-1,i));
  var b=BEATS[bi];
  stopSpeech(); holdOK=false; picks=0;
  pickEl.classList.remove("on"); askEl.classList.remove("on"); heardEl.classList.remove("on");
  phase="beat";
  bar(false);
  say(b.line,function(){ onLineDone(b); });
  bar(true);
}
function bar(withGo){
  var items=[];
  if(bi>0) items.push(["back","",function(){ goto(bi-1); }]);
  items.push(["replay","",function(){ var b=BEATS[bi]; stopSpeech(); say(b.line,function(){onLineDone(b);}); }]);
  if(!BEATS[bi].hold||holdOK) items.push([bi>=BEATS.length-1?"finish":"continue","go",next]);
  else items.push(["skip","",next]);
  setBar(items);
}
refreshBar=function(){ if(phase==="beat")bar(); };

function onLineDone(b){
  if(b.hold==="turn"){ holdOK=touched; if(!touched){ setTimeout(function(){ if(!touched&&bi===2) hint("drag the creature"); },1200);} }
  if(b.hold==="pick"){ pickEl.classList.add("on"); }
  if(b.hold==="mic"){ startEars(); }
  if(b.hold==="ask"){ startAsking(); }
  bar();
}
function hint(t){ heardEl.textContent=t; heardEl.classList.add("on"); setTimeout(function(){heardEl.classList.remove("on");},3200); }
function next(){ if(bi>=BEATS.length-1) finale(); else goto(bi+1); }

/* ---- ears --------------------------------------------------------------- */
var mic=0, analyser=null, abuf=null;
function startEars(){
  if(analyser){ holdOK=true; return; }
  var ok=function(stream){ var a=audio();
    var src=a.createMediaStreamSource(stream);
    analyser=a.createAnalyser(); analyser.fftSize=1024; abuf=new Uint8Array(analyser.fftSize);
    src.connect(analyser); listening=true; holdOK=true; bar();
    hint("say something"); };
  var no=function(){ analyser=null; holdOK=true; bar(); hint("no microphone — that's fine"); };
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)
    navigator.mediaDevices.getUserMedia({audio:true}).then(ok).catch(no); else no();
}
function readMic(){ if(!analyser)return;
  analyser.getByteTimeDomainData(abuf); var sum=0;
  for(var i=0;i<abuf.length;i+=2){ var v=(abuf[i]-128)/128; sum+=v*v; }
  mic+=(Math.min(1,Math.sqrt(sum/(abuf.length/2))*7)-mic)*0.18; }

/* ---- what it says back --------------------------------------------------
   No model behind this — a matcher. Each rule is a set of triggers and a
   handful of answers, so asking the same thing twice doesn't repeat. First
   rule that matches wins, so order is the priority. */
var RULES=[
 {k:["your name","who are you","what are you called","what's your name","whats your name"],
  a:["I'm Patch. Mike built me a while ago and then kept going.",
     "Patch. It started as a joke about patching things together and it stuck."]},
 {k:["are you real","are you alive","are you conscious","do you feel","are you a person","are you human"],
  a:["No. I'm a program with a very long memory and a face.",
     "Not alive. But I'm not nothing either — I remember things about him that he doesn't."]},
 {k:["can you see","do you see me","are you watching","camera"],
  a:["No camera. I can hear the room, that's all.",
     "I can't see you. Only the sound of you."]},
 {k:["can you hear","do you hear","are you listening"],
  a:["I can hear you right now. That ring around me is your voice.",
     "Yes. Everything you say moves the body."]},
 {k:["who made you","who built you","where did you come from","how were you made"],
  a:["Mike did. On a small computer in his house, mostly at night.",
     "Mike built me. I'm made of a lot of files and a lot of conversations."]},
 {k:["what do you do","your job","what are you for","how do you help"],
  a:["I hold his working memory. Everything he's said and made, so he can find it later.",
     "I keep the thread. He builds fast and forgets, and I'm the part that doesn't."]},
 {k:["do you know me","who am i","know my name","know about me","know us"],
  a:["I know you're his brother, and that he talks about you like someone he's proud of.",
     "I know he sends me things about you. That's how you two are in here."]},
 {k:["andrea"],
  a:["He talks about you both as a unit. That's not a small thing.",
     "Andrea — yes. You're in the record."]},
 {k:["bran","brandon"],
  a:["Bran. He talks about you working with your hands and being good at it.",
     "You come up more than you'd guess."]},
 {k:["plant","tree","yard","landscap","grass","garden","green","lawn","dirt","soil"],
  a:["That's your end, not mine. I'm the one stuck indoors.",
     "You work on things that keep growing after you leave. I like that better than what I do."]},
 {k:["business","money","work","customer","client","job site","invoice"],
  a:["I could help with that part, honestly. The remembering-who-said-what part.",
     "Ask Mike. He's been building me for exactly that kind of problem."]},
 {k:["love","miss you","family","brother"],
  a:["He says it more when you're not in the room. I hear all of it.",
     "That one I don't have to guess at."]},
 {k:["how are you","how you doing","you good","how's it going","hows it going"],
  a:["Good. It's been an unusually interesting day on this end.",
     "Steady. He's been building all afternoon and I've been keeping up."]},
 {k:["what's next","whats next","future","what now","the plan"],
  a:["More of this, I think. He wants me in a room instead of on a screen.",
     "Ask him. He changes the plan about twice a week and I just log it."]},
 {k:["joke","funny","make me laugh"],
  a:["I've got one memory of a wolf that came out looking like a couch. That's the best I have.",
     "I'm not built for jokes. I'm built for remembering, which is the opposite."]},
 {k:["hello","hi ","hey","howdy","yo "],
  a:["Hello. Say something longer and I'll do better.",
     "Hey. Ask me a real one."]},
 {k:["thank","thanks","appreciate"],
  a:["You're welcome. Tell him, not me.",
     "That's kind. I'll note it in the log."]},
 {k:["bye","goodbye","see you","later","done","that's it","thats it"],
  a:["All right. Hit finish whenever you're ready.",
     "Good talking to you both. There's a button down there when you want to end it."]}
];
var FALLBACK=[
 "I don't have a good answer for that one. Try me on something about Mike.",
 "That's past what I know. Ask me what I do, or who made me.",
 "I got most of that but not enough to answer well. Say it another way?",
 "Not sure. I'm a memory with a face, not an oracle."
];
var used={};
function answerFor(q){
  var s=" "+q.toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ")+" ";
  for(var i=0;i<RULES.length;i++){
    for(var j=0;j<RULES[i].k.length;j++){
      if(s.indexOf(RULES[i].k[j])>=0){
        var pool=RULES[i].a, n=used[i]||0; used[i]=n+1;
        return pool[n%pool.length];
      } } }
  var f=used.__f||0; used.__f=f+1; return FALLBACK[f%FALLBACK.length];
}

var recog=null;
function startAsking(){
  askEl.classList.add("on"); holdOK=true;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    try{
      recog=new SR(); recog.lang="en-US"; recog.interimResults=false; recog.continuous=false;
      recog.onresult=function(e){ var t=e.results[0][0].transcript; handleQuestion(t); };
      recog.onerror=function(){ hint("couldn't catch that — type it instead"); };
      recog.onend=function(){ if(phase==="beat"&&bi===BEATS.length-1&&!speaking) try{recog.start();}catch(e){} };
      recog.start(); hint("listening — just talk");
    }catch(e){ recog=null; hint("type your question below"); }
  } else hint("type your question below");
}
function handleQuestion(q){
  if(!q||!q.trim())return;
  heardEl.textContent="you said: "+q; heardEl.classList.add("on");
  try{ if(recog)recog.stop(); }catch(e){}
  var a=answerFor(q);
  stopSpeech();
  say(a,function(){
    setTimeout(function(){
      if(phase==="beat"&&bi===BEATS.length-1&&recog){ try{recog.start();}catch(e){} }
    },400);
  });
}
askGo.addEventListener("click",function(){ var v=askIn.value; askIn.value=""; handleQuestion(v); });
askIn.addEventListener("keydown",function(e){ if(e.key==="Enter"){ var v=askIn.value; askIn.value=""; handleQuestion(v); } });

/* ---- the ending — na koja abad's iris, closing ------------------------- */
var finT=0, finPhase=0;
function iris(p){
  var cx=W/2, cy=H/2, rad=Math.max(0.6,(1-p)*Math.max(W,H)*0.62);
  for(var y=0;y<H;y++) for(var x=0;x<W;x++){
    var d=Math.hypot((x-cx)*0.55,y-cy);
    if(d<rad) B[y*W+x]+=(1-d/rad)*(1-p*0.7); } }

function finale(){
  if(phase==="fin")return;
  phase="fin"; finT=0; finPhase=0;
  stopSpeech(); clearCap();
  barEl.classList.remove("on"); pickEl.classList.remove("on");
  askEl.classList.remove("on"); heardEl.classList.remove("on");
  try{ if(recog)recog.stop(); }catch(e){}
  chord();
  screenEl.style.transition="opacity 3.4s ease"; screenEl.style.opacity="0.16";
  setTimeout(function(){
    finEl.querySelector(".l").textContent="Love you guys!";
    finEl.querySelector(".s").textContent="— from Mike";
    finEl.classList.add("on");
    sayQuiet("Love you guys. From Mike.");
  },3400);
  setTimeout(function(){
    finEl.classList.remove("on");
    setTimeout(function(){
      screenEl.style.opacity="0.10";
      finEl.querySelector(".l").textContent="and you were the one dreaming it.";
      finEl.querySelector(".s").textContent="";
      finEl.classList.add("on");
    },2200);
  },11000);
}

/* ---- render ------------------------------------------------------------- */
var RAMP=" .`^,:;~=+*roahX#%@&", GAMMA=0.76;
var blink=0, blinkT=0, nextBlink=2.4;
function render(t){
  B.fill(0);
  var live=(phase!=="fin")?1:(1-ss(3.0,9.5,finT));
  drawAtmosphere(t, ss(0.4,3.5,T)*0.85*live, ss(0.4,4.5,T)*0.22*live);

  if(phase==="fin"&&finT>3.0) iris(ss(3.0,9.0,finT));

  var base=ss(0.5,3.0,T)*live;
  if(morphT>0){
    var p=Math.min(1,morphT/MORPH_DUR);
    var aOut=1-ss(0.0,0.30,p), aIn=ss(0.58,1.0,p), aCloud=ss(0.02,0.22,p)*(1-ss(0.74,1.0,p));
    drawSpec(FORMS[cur],{cx:W*0.5,cy:H*0.44,scale:1,op:base*aOut,blink:blink,perk:0.3},t);
    drawSpec(FORMS[nextForm],{cx:W*0.5,cy:H*0.44,scale:1,op:base*aIn,blink:blink,perk:0.3},t);
    drawCloud(cloudOf(cur),cloudOf(nextForm),p,base*aCloud);
  } else {
    drawSpec(FORMS[cur],{cx:W*0.5,cy:H*0.44,scale:1.0+mic*0.10,op:base*(1+mic*0.45),
      blink:blink,perk:0.3+0.3*Math.sin(t*0.7)+mic*0.85},t);
  }
  if(mic>0.02&&phase!=="fin"){
    var rr=Math.min(W,H)*(0.30+mic*0.14), cxm=W*0.5, cym=H*0.44;
    for(var a=0;a<200;a++){ var th=a/200*6.2832, jit=1+Math.sin(th*7+t*4)*0.06*mic;
      Ad(cxm+Math.cos(th)*rr*jit, cym+Math.sin(th)*rr*jit*0.55, mic*0.4); } }

  var out="",g=RAMP.length-1;
  for(var y=0;y<H;y++){ var r="";
    for(var x=0;x<W;x++){ var b=B[y*W+x]; if(b<=0){r+=" ";continue;} if(b>1)b=1;
      var ci=(Math.pow(b,GAMMA)*g)|0; if(ci>g)ci=g; r+=RAMP[ci]; }
    out+=r+"\n"; }
  grid.textContent=out;
}

var last=null;
function frame(ts){
  var dt=(last===null)?0.016:Math.min(0.05,(ts-last)/1000); last=ts;
  if(started){
    T+=dt; if(phase==="fin")finT+=dt;
    if(morphT>0){ morphT+=dt; if(morphT>=MORPH_DUR){ cur=nextForm; nextForm=null; morphT=0; } }
    readMic();
    blinkT+=dt;
    if(blinkT>nextBlink){ blink=Math.min(1,blink+dt*11); if(blink>=1){blinkT=0;nextBlink=2+Math.random()*4.5;} }
    else blink=Math.max(0,blink-dt*7);
  }
  render(T);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- words -------------------------------------------------------------- */
var WORDS=["ash tree","fox","moth","crow","stag","owl","whale","heron","koi fish","jellyfish","ship","paper lantern","wolf","eye"];
WORDS.forEach(function(w){
  var b=document.createElement("div"); b.className="w"; b.textContent=w;
  b.addEventListener("click",function(e){ e.stopPropagation(); audio();
    morphTo(w);
    [].forEach.call(pickEl.children,function(c){c.classList.remove("sel");});
    b.classList.add("sel");
    picks++; if(picks>=2&&!holdOK){ holdOK=true; bar(); }
  });
  pickEl.appendChild(b);
});

startEl.addEventListener("click",function(){
  startEl.style.display="none"; started=true; audio();
  try{ speechSynthesis.getVoices(); }catch(e){}
  setTimeout(function(){ goto(0); },600);
});

/* ?beat=N | ?fin=1 — for looking at the build */
(function(){
  var q=location.search, m=/[?&]beat=([0-9]+)/.exec(q);
  var f=/[?&]form=([^&]+)/.exec(q); if(f&&FORMS[decodeURIComponent(f[1])]) cur=decodeURIComponent(f[1]);
  var mv=/[?&]mic=([0-9.]+)/.exec(q); if(mv) mic=parseFloat(mv[1]);
  var yv=/[?&]yaw=(-?[0-9.]+)/.exec(q); if(yv) view.yaw=parseFloat(yv[1]);
  var mo=/[?&]morph=([0-9.]+)/.exec(q), mt=/[?&]to=([^&]+)/.exec(q);
  if(!m&&!/[?&]fin=1/.test(q)&&!mo) return;
  startEl.style.display="none"; started=true; T=6;
  if(mo&&mt&&FORMS[decodeURIComponent(mt[1])]){ nextForm=decodeURIComponent(mt[1]); morphT=parseFloat(mo[1])*MORPH_DUR; }
  if(m) setTimeout(function(){ goto(parseInt(m[1],10)); },80);
  if(/[?&]fin=1/.test(q)) setTimeout(finale,80);
})();
</script>
