/* ---- the grid ---------------------------------------------------------- */
var W,H,FS,B;
function sizeGrid(){
  var vw=innerWidth, vh=innerHeight;
  FS=Math.max(5,Math.min(30,Math.round(Math.min(vw,vh)/46)));
  screenEl.style.fontSize=FS+"px";
  W=Math.max(20,Math.min(400,Math.floor(vw/(FS*0.60))));
  H=Math.max(12,Math.min(260,Math.floor(vh/(FS*0.92))));
  B=new Float32Array(W*H);
}
sizeGrid();
addEventListener("resize",sizeGrid);
addEventListener("orientationchange",function(){setTimeout(sizeGrid,200);});

function Ad(x,y,b){ x|=0;y|=0; if(x<0||y<0||x>=W||y>=H)return; B[y*W+x]+=b; }
function splat(x,y,b,r){ x|=0;y|=0;r=r|0;
  for(var dy=-r;dy<=r;dy++){ var yy=y+dy; if(yy<0||yy>=H)continue;
    for(var dx=-r;dx<=r;dx++){ var xx=x+dx; if(xx<0||xx>=W)continue;
      var d=Math.sqrt(dx*dx+dy*dy*3.0)/r; if(d>1)continue;
      var f=1-d; B[yy*W+xx]+=b*f*f; } } }
/* dense core, soft rim, aspect-corrected so a circle looks round, dithered so
   the interior doesn't band into a halftone rectangle */
function blobStamp(x,y,b,r,ay){
  x|=0; y|=0; r=Math.max(1,r);
  var ry=Math.max(1,r*ay), R=Math.ceil(r), RY=Math.ceil(ry);
  for(var dy=-RY;dy<=RY;dy++){ var yy=y+dy; if(yy<0||yy>=H)continue;
    for(var dx=-R;dx<=R;dx++){ var xx=x+dx; if(xx<0||xx>=W)continue;
      var u=dx/r, v=dy/ry, d=Math.sqrt(u*u+v*v); if(d>1)continue;
      var f=1-d; f=f*f*(1.35-0.35*f);
      var n=1+((((xx*7+yy*13)%5)-2)*0.035);
      B[yy*W+xx]+=b*f*n; } } }
function ss(a,b,x){ x=(x-a)/(b-a); if(x<0)x=0; if(x>1)x=1; return x*x*(3-2*x); }
function lerp(a,b,k){ return a+(b-a)*k; }

   `tr` is the body's transform: centre in grid cells, scale, facing, opacity,
   plus a per-body blink and antenna perk. Everything else (breathe, bob, sway,
   perk) is the involuntary layer, running underneath whatever the score does. */
function drawSpec(spec,tr,t){
  if(tr.op<=0.001) return;
  var s=Math.min(W,H)*0.42*spec.unit*tr.scale;
  var ay=0.55;                               /* character cells are tall */
  var cxp=tr.cx, cyp=tr.cy, fac=tr.facing, dim=tr.op;
  var breathe=1+Math.sin(t*1.35)*0.055;
  var blink=tr.blink||0, perk=tr.perk||0;

  function PT(x,y,b,r){ if(r<=1) Ad(cxp+x,cyp+y*ay,b); else splat(cxp+x,cyp+y*ay,b,r); }
  function LN(x0,y0,x1,y1,w){
    var X0=cxp+x0, Y0=cyp+y0*ay, X1=cxp+x1, Y1=cyp+y1*ay;
    var dx=X1-X0, dy=Y1-Y0, steps=Math.max(2,Math.ceil(Math.hypot(dx,dy)*1.7));
    var wgt=w*dim;
    for(var i=0;i<=steps;i++){
      var u=i/steps, px=X0+dx*u, py=Y0+dy*u;
      splat(px|0,py|0,wgt*0.55,1);
      Ad(px|0,py|0,wgt*0.85);
    }
  }

  for(var i=0;i<spec.parts.length;i++){
    var q=spec.parts[i], ox=0, oy=0, gain=1, rmul=1;
    if(q.anim==="breathe"){ rmul=breathe; gain=breathe; }
    else if(q.anim==="sway"){ ox+=Math.sin(t*(q.rate||1.5)+i)*(q.amp||0.08)*s; }
    else if(q.anim==="bob"){ oy+=Math.sin(t*(q.rate||1.2)+i*0.7)*(q.amp||0.06)*s; }
    else if(q.anim==="perk"){ oy-=(q.amp||0.12)*s*perk; }

    if(q.k==="blob"){
      blobStamp(cxp+(q.x*fac*s+ox), cyp+(q.y*s+oy)*ay, q.b*gain*dim*1.35, s*q.r*rmul, ay);
    } else if(q.k==="eye"){
      var eyeB=q.b*(0.8+0.3*Math.sin(t*2))*(1-blink*0.92)*dim;
      PT(q.x*fac*s+ox, q.y*s+oy, eyeB, 1);
      PT(q.x*fac*s+ox, q.y*s+oy, q.b*0.25*dim, Math.max(1,s*0.03));
    } else if(q.k==="line"||q.k==="curve"){
      for(var j=0;j<q.p.length-1;j++){
        var w0=q.p.length>2?(j/(q.p.length-1)):1, w1=q.p.length>2?((j+1)/(q.p.length-1)):1;
        LN(q.p[j][0]*fac*s+ox*w0,   q.p[j][1]*s+oy*w0,
           q.p[j+1][0]*fac*s+ox*w1, q.p[j+1][1]*s+oy*w1, q.b);
      }
    }
  }
}

/* ---- atmosphere -------------------------------------------------------- */
var dustMotes=[];
(function(){ for(var i=0;i<110;i++) dustMotes.push({x:Math.random(),y:Math.random(),
  z:0.25+Math.random()*0.75, ph:Math.random()*6.28, sp:0.4+Math.random()*0.9}); })();
function drawAtmosphere(t,amt,hazeAmt){
  if(hazeAmt>0){
    var cx=W/2, cy=H/2;
    for(var yy=0;yy<H;yy++) for(var xx=0;xx<W;xx++){
      var d=Math.sqrt((xx-cx)*(xx-cx)*0.36+(yy-cy)*(yy-cy))/(H*0.6);
      if(d<1) B[yy*W+xx]+=hazeAmt*0.10*(1-d)*(1-d);
    }
  }
  if(amt<=0) return;
  for(var i=0;i<dustMotes.length;i++){ var m=dustMotes[i];
    var dx=(m.x+t*0.012*m.sp*m.z)%1, dy=(m.y+Math.sin(t*0.18*m.sp+m.ph)*0.03+t*0.004*m.sp)%1;
    if(dx<0)dx+=1; if(dy<0)dy+=1;
    var tw=0.45+0.55*Math.abs(Math.sin(t*1.1+m.ph));
    Ad((dx*W)|0,(dy*H)|0,(0.022+0.055*tw*m.z)*amt);
  }
}


/* ---- the trick: a real morph, not a dissolve -------------------------------
   Crossfading one body into another is a dissolve — both shapes are on screen
   and neither is moving. So each body is sampled into a cloud of points
   (scattered through the blobs, walked along the silhouettes), and the SAME
   cloud flies from one body's positions to the other's. Each point gets its own
   staggered start and an outward bow, so the body comes apart and reassembles
   somewhere else instead of fading. */
var CLOUD_N=560;
function hash01(i){ var x=Math.sin(i*127.1)*43758.5453; return x-Math.floor(x); }
function sampleSpec(spec){
  var pts=[], parts=spec.parts, i, j;
  var weights=[], total=0;
  for(i=0;i<parts.length;i++){
    var q=parts[i];
    var w=(q.k==="blob")?Math.max(2,q.r*160):(q.k==="eye")?3:((q.p.length-1)*22);
    weights.push(w); total+=w;
  }
  for(i=0;i<parts.length;i++){
    var q2=parts[i], n=Math.max(1,Math.round(CLOUD_N*weights[i]/total));
    for(j=0;j<n;j++){
      var s=pts.length;
      if(q2.k==="blob"){
        var a=hash01(s*3.1)*6.2832, r=Math.sqrt(hash01(s*7.7))*q2.r;
        pts.push([q2.x+Math.cos(a)*r, q2.y+Math.sin(a)*r]);
      } else if(q2.k==="eye"){
        pts.push([q2.x,q2.y]);
      } else {
        var u=(j/Math.max(1,n-1))*(q2.p.length-1), k=Math.min(q2.p.length-2,Math.floor(u)), f=u-k;
        pts.push([q2.p[k][0]+(q2.p[k+1][0]-q2.p[k][0])*f,
                  q2.p[k][1]+(q2.p[k+1][1]-q2.p[k][1])*f]);
      }
    }
  }
  /* pad or trim to a fixed count so any two clouds pair up one-to-one */
  while(pts.length<CLOUD_N) pts.push(pts[pts.length%Math.max(1,pts.length-1)].slice());
  return pts.slice(0,CLOUD_N);
}
var CLOUDS={};
function cloudOf(name){ if(!CLOUDS[name]) CLOUDS[name]=sampleSpec(FORMS[name]); return CLOUDS[name]; }

var cur="ash tree", nextForm=null, morphT=0, MORPH_DUR=2.1;
function morphTo(name){
  if(name===cur||morphT>0) return;
  nextForm=name; morphT=0.0001;
}
function drawCloud(a,b,p,t){
  var s=Math.min(W,H)*0.42, cx=W*0.5, cy=H*0.46, ay=0.55;
  for(var i=0;i<CLOUD_N;i++){
    /* staggered: some points leave early and arrive late */
    var off=hash01(i*1.7)*0.42, u=(p-off)/(1-0.42); if(u<0)u=0; if(u>1)u=1;
    u=u*u*(3-2*u);
    var bow=Math.sin(u*Math.PI)*(0.10+hash01(i*5.3)*0.22);   /* the outward arc */
    var ang=hash01(i*9.1)*6.2832;
    var x=a[i][0]+(b[i][0]-a[i][0])*u+Math.cos(ang)*bow;
    var y=a[i][1]+(b[i][1]-a[i][1])*u+Math.sin(ang)*bow;
    var br=0.30+0.5*Math.sin(u*Math.PI);                     /* brightest in flight */
    Ad(cx+x*s, cy+y*s*ay, br);
    splat((cx+x*s)|0,(cy+y*s*ay)|0,br*0.35,1);
  }
}

var RAMP=" .`^,:;~=+*roahX#%@&", GAMMA=0.82;

/* ---- the script -------------------------------------------------------- */
var LINES=[
  [ 0.5,  7.0, "hi bran. hi andrea."],
  [ 7.6, 15.0, "i'm patch. i live on a computer in mike's house\nand i keep track of things for him."],
  [15.6, 23.0, "he talks, i answer out loud, and this is the body\ni'm wearing while i do it."],
  [23.6, 31.0, "i can be anything he asks for.\nhere, you try it —"]
];
var T=0, started=false, last=null, blink=0, blinkT=0, nextBlink=2.4, opened=false;

function render(){
  B.fill(0);
  var t=T;
  drawAtmosphere(t, ss(0.5,4,t)*0.85, ss(0.5,5,t)*0.20);
  var op=ss(0.6,4.5,t);
  if(morphT>0){
    var p=Math.min(1,morphT/MORPH_DUR);
    drawCloud(cloudOf(cur),cloudOf(nextForm),p,t);
  } else {
    drawSpec(FORMS[cur],{cx:W*0.5,cy:H*0.46,scale:1.0+mic*0.13,facing:1,op:op*(1+mic*0.5),
      blink:blink,perk:0.3+0.3*Math.sin(t*0.7)+mic*0.9},t);
  }
  if(mic>0.02){
    var rr=Math.min(W,H)*(0.30+mic*0.26), cxm=W*0.5, cym=H*0.46;
    for(var a=0;a<180;a++){
      var th=a/180*6.2832, jit=1+Math.sin(th*7+t*4)*0.06*mic;
      Ad(cxm+Math.cos(th)*rr*jit, cym+Math.sin(th)*rr*jit*0.55, mic*0.5);
    }
  }
  var out="", g=RAMP.length-1;
  for(var y=0;y<H;y++){ var row="";
    for(var x=0;x<W;x++){ var b=B[y*W+x]; if(b<=0){row+=" ";continue;} if(b>1)b=1;
      var ci=(Math.pow(b,GAMMA)*g)|0; if(ci>g)ci=g; row+=RAMP[ci]; }
    out+=row+"\n"; }
  grid.textContent=out;
}

function lines(){
  var show=null;
  for(var i=0;i<LINES.length;i++) if(T>=LINES[i][0]&&T<LINES[i][1]) show=LINES[i][2];
  if(show!==lines.cur){
    lines.cur=show;
    if(show){ sayEl.textContent=show; sayEl.classList.add("on"); }
    else sayEl.classList.remove("on");
  }
  if(!opened&&T>29){ opened=true; pickEl.classList.add("on");  }
}
lines.cur=undefined;

function frame(ts){
  if(started){
    if(last!==null){ var dt=Math.min(0.05,(ts-last)/1000); T+=dt;
      if(morphT>0){ morphT+=dt; if(morphT>=MORPH_DUR){ cur=nextForm; nextForm=null; morphT=0; } }
      readMic();
      if(phase==="listening"){
        phaseT+=dt;
        if(phaseT>6&&phaseT<6.05) say("there you are.",4000);
        if(phaseT>12&&phaseT<12.05) say("that's it. that's the whole thing.\nit hears him, and it answers.",6000);
        if(phaseT>20) finale();
      }
      blinkT+=dt;
      if(blinkT>nextBlink){ blink=Math.min(1,blink+dt*11); if(blink>=1){ blinkT=0; nextBlink=2+Math.random()*4.5; } }
      else blink=Math.max(0,blink-dt*7);
    }
    last=ts;
  }
  render(); lines();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- the words --------------------------------------------------------- */
var WORDS=["ash tree","fox","moth","crow","stag","owl","whale","heron","koi fish","jellyfish","ship","paper lantern","wolf","eye"];
WORDS.forEach(function(w){
  var b=document.createElement("div"); b.className="w"; b.textContent=w;
  b.addEventListener("click",function(){
    morphTo(w);
    [].forEach.call(pickEl.children,function(c){ c.classList.remove("sel"); });
    b.classList.add("sel");
    sayEl.classList.remove("on"); lines.cur=null;
    picks++; if(picks>=3) setTimeout(offerEars,2600);
  });
  pickEl.appendChild(b);
});

/* ---- the part that isn't a picture ---------------------------------------
   Everything above is a drawing you can change. This is the actual thing: the
   creature takes the microphone and reacts to a voice in the room, the same way
   it does on Mike's machine. Nothing is sent anywhere — the audio never leaves
   the page, there's no server behind this file at all. */
var mic=0, micRaw=0, analyser=null, buf=null, phase="play", phaseT=0, picks=0;

function say(text,ms){ sayEl.textContent=text; sayEl.classList.add("on");
  if(ms) setTimeout(function(){ sayEl.classList.remove("on"); },ms); }

function offerEars(){
  if(phase!=="play") return;
  phase="offer";
  pickEl.classList.remove("on");
  setTimeout(function(){
    say("ok. that's the party trick.\nhere's the actual thing —",4200);
    setTimeout(function(){ bigEl.classList.add("on"); },4400);
  },900);
}

function startEars(){
  bigEl.classList.remove("on");
  phase="listening"; phaseT=0;
  var ok=function(stream){
    var AC=new (window.AudioContext||window.webkitAudioContext)();
    var src=AC.createMediaStreamSource(stream);
    analyser=AC.createAnalyser(); analyser.fftSize=1024;
    buf=new Uint8Array(analyser.fftSize);
    src.connect(analyser);
    say("say something. anything.",5200);
  };
  var no=function(){
    analyser=null;
    say("no mic — that's fine.\nthe real one is in mike's kitchen anyway.",5200);
  };
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(ok).catch(no);
  } else no();
}
bigEl.addEventListener("click",startEars);

function readMic(){
  if(!analyser) return;
  analyser.getByteTimeDomainData(buf);
  var sum=0;
  for(var i=0;i<buf.length;i+=2){ var v=(buf[i]-128)/128; sum+=v*v; }
  micRaw=Math.sqrt(sum/(buf.length/2));
  mic+=(Math.min(1,micRaw*7)-mic)*0.18;
}

function speak(text){
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.rate=0.88; u.pitch=0.95; u.volume=1;
    var vs=speechSynthesis.getVoices();
    for(var i=0;i<vs.length;i++){ if(/Samantha|Karen|Daniel|Serena/i.test(vs[i].name)){ u.voice=vs[i]; break; } }
    speechSynthesis.speak(u);
  }catch(e){}
}

function finale(){
  if(phase==="finale") return;
  phase="finale"; phaseT=0;
  morphTo("ash tree");
  sayEl.classList.remove("on");
  pickEl.classList.remove("on"); bigEl.classList.remove("on");
  /* the body recedes so the last line has the screen to itself */
  setTimeout(function(){ screenEl.style.transition="opacity 2.4s ease"; screenEl.style.opacity="0.30"; },2200);
  setTimeout(function(){
    finEl.textContent="Mike says bye — and love you.";
    finEl.classList.add("on");
    speak("Mike says bye. And love you.");
  },2400);
}

startEl.addEventListener("click",function(){ startEl.style.display="none"; started=true; try{speechSynthesis.getVoices();}catch(e){} });
/* ?t=N&form=fox — how the build gets looked at, since a screenshot can't tap */
(function(){
  var q=location.search, m=/[?&]t=([0-9.]+)/.exec(q);
  var f=/[?&]form=([^&]+)/.exec(q);
  if(f&&FORMS[decodeURIComponent(f[1])]) cur=decodeURIComponent(f[1]);
  if(!m&&!f) return;
  if(m) T=parseFloat(m[1])||0;
  startEl.style.display="none"; started=true;
  if(T>29){ opened=true; pickEl.classList.add("on");  }
  if(/[?&]stage=offer/.test(q)) setTimeout(offerEars,80);
  if(/[?&]stage=fin/.test(q)) setTimeout(finale,80);
  if(/[?&]mic=([0-9.]+)/.test(q)) mic=parseFloat(/[?&]mic=([0-9.]+)/.exec(q)[1]);
  var to=/[?&]to=([^&]+)/.exec(q), mp=/[?&]mp=([0-9.]+)/.exec(q);
  if(to&&FORMS[decodeURIComponent(to[1])]){ nextForm=decodeURIComponent(to[1]);
    morphT=mp?parseFloat(mp[1])*MORPH_DUR:0.0001; }
})();
</script>
